<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Carbonautas · carbono, regeneração, rede e navegação">
  <defs>
    <linearGradient id="cycle" x1="18" y1="18" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6EC6A0"/>
      <stop offset=".55" stop-color="#1AA39E"/>
      <stop offset="1" stop-color="#297FA8"/>
    </linearGradient>
    <linearGradient id="leaf" x1="64" y1="13" x2="87" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72C98E"/>
