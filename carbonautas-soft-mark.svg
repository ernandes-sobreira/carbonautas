  <!-- nós / rede -->
  <circle cx="20" cy="48" r="4.5" fill="#6EBECE" stroke="#fff" stroke-width="2"/>
  <circle cx="31" cy="72" r="4.5" fill="#71BE91" stroke="#fff" stroke-width="2"/>
