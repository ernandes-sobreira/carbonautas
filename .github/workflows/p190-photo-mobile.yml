name: P190 foto mobile

on:
  push:
    branches: [photo-mobile-fix-p190]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p190-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção pontual
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''  <div class="lb-cap" id="lbCap"></div>\n  <div class="lb-social" id="lbSocial"></div>\n  <button class="lb-del" id="lbDel" style="display:none">Apagar esta foto</button>'''
          new='''  <div class="lb-cap" id="lbCap"></div>\n  <button class="lb-del" id="lbDel" style="display:none">Apagar esta foto</button>\n  <div class="lb-social" id="lbSocial"></div>'''
          if s.count(old) != 1:
              raise SystemExit(f'Bloco do lightbox esperado 1 vez; encontrado {s.count(old)}')
          s=s.replace(old,new)
          marker='''\n</body>\n</html>'''
          css='''\n<style id="p190PhotoMobileFix">\n/* P190 · foto/print no celular: excluir visível e modal com rodapé acessível */\n@media(max-width:920px){\n  body:has(#lightbox.open) .soft-bottom-nav,\n  body:has(#photoOverlay.open) .soft-bottom-nav{display:none!important}\n  #lightbox.open{overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior:contain!important;padding-bottom:calc(18px + env(safe-area-inset-bottom))!important}\n  #lightbox #lbDel{align-self:center!important;margin:10px 14px 12px!important;min-height:44px!important;padding:10px 16px!important;background:#fff1f3!important;color:#b53750!important;border:1px solid #efc4cd!important;border-radius:13px!important;font-weight:850!important;justify-content:center!important}\n  #photoOverlay{padding:8px 8px calc(8px + env(safe-area-inset-bottom))!important;align-items:flex-start!important;overflow:hidden!important}\n  #photoOverlay .modal{display:flex!important;flex-direction:column!important;width:100%!important;max-width:560px!important;max-height:calc(100dvh - 16px - env(safe-area-inset-bottom))!important;margin:0 auto!important;overflow:hidden!important}\n  #photoOverlay .modal-h,#photoOverlay .modal-f{flex:0 0 auto!important}\n  #photoOverlay .modal-b{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;-webkit-overflow-scrolling:touch!important;padding-bottom:18px!important}\n  #photoOverlay .modal-f{position:sticky!important;bottom:0!important;z-index:6!important;padding:10px 14px calc(10px + env(safe-area-inset-bottom))!important}\n  #photoOverlay #savePhotoBtn{flex:1 1 auto!important;min-height:48px!important;justify-content:center!important}\n}\n</style>\n'''
          if s.count(marker) != 1:
              raise SystemExit('Fechamento do documento não localizado de forma única')
          s=s.replace(marker,css+marker)
          if s.count('id="p190PhotoMobileFix"') != 1:
              raise SystemExit('CSS P190 não ficou único')
          if s.index('id="lbDel"') > s.index('id="lbSocial"'):
              raise SystemExit('Botão excluir ainda ficou depois do social')
          p.write_text(s,encoding='utf-8')
      - name: Validar invariantes
        shell: bash
        run: |
          test "$(grep -c 'id="p190PhotoMobileFix"' index.html)" -eq 1
          test "$(grep -c 'id="lbDel"' index.html)" -eq 1
          test "$(grep -c 'id="lbSocial"' index.html)" -eq 1
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "P190: corrige exclusão e rolagem de fotos [p190-applied]"
          git push
