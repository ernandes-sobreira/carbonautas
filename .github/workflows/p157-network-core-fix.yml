name: P157 network core repair
on:
  push:
    branches: [fix/p157-network-core]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair network architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- index.html: one relation engine, explicit relation semantics ----------
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          start=s.index('function p135NetworkReasonMatches(r,mode){')
          end=s.index('\n/* ============ RENDER: STATS ============ */', start)
          core=r'''function p135NetworkReasonMatches(r,mode){
  mode=String(mode||'all').toLowerCase();
  if(mode==='orientation')mode='orientacao';
  if(mode==='projects')mode='projetos';
  if(mode==='production')mode='producao';
  if(!mode||mode==='all')return true;
  const txt=String(r?.label||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(mode==='orientacao')return false; // orientação real vem de state.activities
  if(mode==='projetos')return r?.type==='linha'||/projeto|pesquisa|campo|grupo|rede/.test(txt);
  if(mode==='producao')return r?.type==='producao'||/artigo|publica|produc|coautor|manuscrit|relat|dado|dataset|capitul|livro/.test(txt);
  return true;
}
function p157Mode(){
  const m=String(window.__p135NetworkMode||'all').toLowerCase();
  return m==='orientation'?'orientacao':m==='projects'?'projetos':m==='production'?'producao':m;
}
function p157Coordinator(members){
  const own=(typeof myId!=='undefined'&&myId)?members.find(m=>m.id===myId):null;
  return own||members.find(m=>String(m.nivel||'')==='coord'||/coorden/.test(String(m.nivel||m.papel||m.status||'').toLowerCase()))||null;
}
function p157OrientationCounts(members){
  const ids=new Set(members.map(m=>String(m.id))), coord=p157Coordinator(members), counts=new Map();
  if(!coord)return {coord:null,counts,total:0};
  let total=0;
  (state.activities||[]).forEach(a=>{
    const type=String(a?.type||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    if(!type.includes('orient'))return;
    const owner=String(a?.ownerId||a?.memberId||'');
    if(!owner||owner===String(coord.id)||!ids.has(owner))return;
    counts.set(owner,(counts.get(owner)||0)+1);total++;
  });
  return {coord,counts,total};
}
function p157OrientationWidth(n){return Math.min(10.4,3.2+1.8*Math.max(0,(Number(n)||1)-1))}
function p157OrientationForce(n){return Math.min(3.4,1.25+0.75*Math.log2((Number(n)||1)+1))}
function p157ForceWeight(d){return Math.max(.25,Number(d?.forceWeight??d?.w??1)||1)}
function p157StrokeWidth(d){return Math.max(.8,Number(d?.visualWidth)||(.8+(Number(d?.w)||0)*.9))}
function p157PairKey(l){
  const a=String(l?.source?.id||l?.source||''),b=String(l?.target?.id||l?.target||'');
  return [a,b].sort().join('|')+'|'+String(l?.relationType||'base');
}
function p157Push(links,link){
  const key=p157PairKey(link),old=links.find(x=>p157PairKey(x)===key);
  if(!old){links.push(link);return}
  old.reasons=[...(old.reasons||[]),...(link.reasons||[])];
  old.w=Math.max(Number(old.w)||0,Number(link.w)||0);
  old.forceWeight=Math.max(Number(old.forceWeight)||0,Number(link.forceWeight)||0);
  old.visualWidth=Math.max(Number(old.visualWidth)||0,Number(link.visualWidth)||0);
  old.orientationCount=Math.max(Number(old.orientationCount)||0,Number(link.orientationCount)||0);
}
function p157ProductionLinks(members){
  const ids=new Set(members.map(m=>String(m.id))),out=[];
  (state.publicacoes||[]).forEach(p=>{
    const people=[p.memberId,...(Array.isArray(p.collaboratorMemberIds)?p.collaboratorMemberIds:[])].map(String).filter((v,i,a)=>v&&ids.has(v)&&a.indexOf(v)===i);
    for(let i=0;i<people.length;i++)for(let j=i+1;j<people.length;j++)p157Push(out,{
      source:people[i],target:people[j],relationType:'production',reasons:[{type:'producao',label:`Produção compartilhada${p.title?' · '+p.title:''}`}],
      w:1,forceWeight:1.25,visualWidth:2.8,aux:false
    });
  });
  return out;
}
function buildLinks(members){
  const mode=p157Mode(),includeAux=$('#tHubLinks')?$('#tHubLinks').checked:true,links=[];
  if(mode!=='orientacao'){
    for(let i=0;i<members.length;i++){
      for(let j=i+1;j<members.length;j++){
        const allReasons=pairReasons(members[i],members[j],includeAux);
        const reasons=mode==='all'?allReasons:allReasons.filter(r=>p135NetworkReasonMatches(r,mode));
        if(!reasons.length)continue;
        const hasLinha=reasons.some(r=>r.type==='linha');
        const w=reasons.reduce((sum,r)=>sum+(r.type==='linha'?1:.45),0);
        const relationType=mode==='projetos'?'projects':mode==='producao'?'production':'base';
        p157Push(links,{source:members[i].id,target:members[j].id,reasons,w,forceWeight:w,aux:!hasLinha,relationType,
          visualWidth:relationType==='projects'?2.1:relationType==='production'?2.8:undefined});
      }
    }
  }
  const {coord,counts}=p157OrientationCounts(members);
  if((mode==='orientacao'||mode==='all')&&coord){
    for(const [owner,n] of counts.entries())p157Push(links,{
      source:coord.id,target:owner,relationType:'orientation',orientationCount:n,
      reasons:[{type:'orientacao',label:`Orientação registrada · ${n} registro${n===1?'':'s'}`}],
      w:1,forceWeight:p157OrientationForce(n),visualWidth:p157OrientationWidth(n),aux:false
    });
  }
  if(mode==='producao'||mode==='all')p157ProductionLinks(members).forEach(l=>p157Push(links,l));
  return links;
}
'''
          s=s[:start]+core+s[end:]

          old_force=""".distance(d=>d.aux?150:90-d.w*8)\n      .strength(d=>d.aux?0.045:0.12+d.w*0.05))"""
          new_force=""".distance(d=>d.aux?150:Math.max(58,90-p157ForceWeight(d)*8))\n      .strength(d=>d.aux?0.045:Math.min(.32,0.12+p157ForceWeight(d)*0.05)))"""
          assert old_force in s, 'force block not found'
          s=s.replace(old_force,new_force,1)

          old_join="""gLink.selectAll('line').data(links,d=>d.source.id+'-'+d.target.id).join(\n    e=>e.append('line').attr('class',d=>'link'+(d.aux?' aux':'')).attr('stroke-width',d=>0.8+d.w*0.9),\n    u=>u.attr('class',d=>'link'+(d.aux?' aux':'')).attr('stroke-width',d=>0.8+d.w*0.9),\n    x=>x.remove()\n  );"""
          new_join="""gLink.selectAll('line').data(links,d=>[d.source.id,d.target.id,d.relationType||'base'].join('-')).join(\n    e=>e.append('line').attr('class',d=>'link rel-'+(d.relationType||'base')+(d.aux?' aux':'')).attr('stroke-width',p157StrokeWidth),\n    u=>u.attr('class',d=>'link rel-'+(d.relationType||'base')+(d.aux?' aux':'')).attr('stroke-width',p157StrokeWidth),\n    x=>x.remove()\n  );"""
          assert old_join in s, 'link join not found'
          s=s.replace(old_join,new_join,1)

          css_anchor="  .link.aux.hl{stroke:var(--indigo);stroke-opacity:.85}\n"
          css_add="""  .link.aux.hl{stroke:var(--indigo);stroke-opacity:.85}\n  .link.rel-orientation{stroke:#168f94;stroke-opacity:.94;stroke-dasharray:none;stroke-linecap:round}\n  .link.rel-orientation.hl{stroke:#0b7479;stroke-opacity:1}\n  .link.rel-production{stroke:#6c5ce0;stroke-opacity:.82;stroke-dasharray:9 6;stroke-linecap:round}\n  .link.rel-production.hl{stroke:#5142c7;stroke-opacity:1}\n  .link.rel-projects{stroke:#2e9e5b;stroke-opacity:.76;stroke-dasharray:none}\n  .link.rel-projects.hl{stroke:#1d7c43;stroke-opacity:1}\n"""
          assert css_anchor in s, 'link css anchor not found'
          s=s.replace(css_anchor,css_add,1)
          p.write_text(s,encoding='utf-8')

          # ---------- P135: toolbar is the ONLY relation-mode controller ----------
          p=Path('p135-rede-acompanhamento.js'); s=p.read_text(encoding='utf-8')
          old="function installBuildLinks(){if(baseBuildLinks)return true;let fn=null;try{fn=buildLinks}catch(_e){}if(typeof fn!=='function')return false;baseBuildLinks=fn;const wrapped=function(members){let links=baseBuildLinks(members),prod=productionLinks(members,links);if(relationMode==='all')links=links.concat(prod);else if(relationMode==='production')links=links.filter(l=>relationKinds(l).has('production')).concat(prod);else links=links.filter(l=>relationKinds(l).has(relationMode));graphInsight(members,links);return links};try{buildLinks=wrapped}catch(_e){}window.buildLinks=wrapped;return true}"
          new="function installBuildLinks(){if(baseBuildLinks)return true;let fn=null;try{fn=buildLinks}catch(_e){}if(typeof fn!=='function')return false;baseBuildLinks=fn;const wrapped=function(members){const links=baseBuildLinks(members);graphInsight(members,links);return links};try{buildLinks=wrapped}catch(_e){}window.buildLinks=wrapped;return true}"
          assert old in s, 'P135 installBuildLinks exact block not found'
          s=s.replace(old,new,1)
          old="function setMode(mode){relationMode=mode;$$('[data-p135-mode]').forEach(b=>b.classList.toggle('on',b.dataset.p135Mode===mode));redraw()}"
          new="function setMode(mode){relationMode=mode;window.__p135NetworkMode=mode||'all';$$('[data-p135-mode]').forEach(b=>b.classList.toggle('on',b.dataset.p135Mode===mode));const el=$('#p135RedeInsight');if(el){const labels={all:'Todas as relações',orientation:'Orientações registradas · linha mais grossa = mais orientações',projects:'Projetos e linhas compartilhadas',production:'Produção compartilhada · linha roxa tracejada'};el.textContent=labels[mode]||labels.all}redraw()}"
          assert old in s, 'P135 setMode not found'
          s=s.replace(old,new,1)
          marker="let baseBuildLinks=null;"
          s=s.replace(marker,marker+"\nwindow.__p135NetworkMode=window.__p135NetworkMode||'all';",1)
          p.write_text(s,encoding='utf-8')

          # ---------- UI module: retain mobile/timeline polish, never restyle graph ----------
          ui=r'''/* Carbonautas P157 · acabamento leve da Rede no mobile\n   Somente painel da pessoa e linha do tempo. O motor de relações fica no núcleo. */\n(function(){\n'use strict';\nif(window.__CARBONAUTAS_P157_REDE_UI)return;window.__CARBONAUTAS_P157_REDE_UI=true;\nconst $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));\nfunction polishTimeline(){const detail=$('#viewRede #detail'),timeline=detail&&$('#p128Timeline',detail);if(!timeline)return;timeline.setAttribute('aria-label','Linha do tempo da pessoa');$$('li',timeline).forEach(li=>Array.from(li.childNodes).forEach(node=>{if(node.nodeType===3&&node.textContent)node.textContent=node.textContent.replace(/Orientação\\s*·\\s*Orientação\\s*·\\s*/i,'Orientação · ')}))}\nfunction injectCss(){if($('#p157RedeUiStyle'))return;const st=document.createElement('style');st.id='p157RedeUiStyle';st.textContent=`@media (max-width:920px){#viewRede .main{position:relative!important;overflow:hidden!important}#viewRede #detail.detail.open{position:absolute!important;inset:0!important;width:100%!important;max-width:none!important;height:100%!important;max-height:none!important;flex:0 0 100%!important;z-index:60!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;overflow:hidden!important}#viewRede #detail .detail-inner{width:100%!important;height:100%!important;max-height:none!important;overflow-y:auto!important;overflow-x:hidden!important;padding:0 0 calc(82px + env(safe-area-inset-bottom))!important;-webkit-overflow-scrolling:touch}#viewRede #detail .dh{padding:18px 18px 15px!important}#viewRede #detail .dsec{padding:14px 18px!important}#viewRede #detail .dactions{padding:14px 18px!important;gap:8px!important}#viewRede #p128Timeline{margin:8px 18px 0!important;padding:16px 0 0!important;border-top:1px solid #e3ecea!important}#viewRede #p128Timeline h4{margin:0 0 12px!important;font-size:15px!important;line-height:1.2!important;font-weight:850!important;color:#173541!important}#viewRede #p128Timeline ol{margin:0!important;padding:0!important;border-left:0!important;display:flex!important;flex-direction:column!important;gap:8px!important}#viewRede #p128Timeline li{position:relative!important;display:grid!important;grid-template-columns:72px minmax(0,1fr)!important;column-gap:10px!important;align-items:start!important;margin:0!important;padding:10px 12px 10px 18px!important;border:1px solid #e2ebe9!important;border-radius:13px!important;background:#fbfdfd!important;font-size:12.5px!important;line-height:1.38!important;color:#294750!important;overflow-wrap:anywhere!important}#viewRede #p128Timeline li:before{left:7px!important;top:15px!important;width:6px!important;height:6px!important}#viewRede #p128Timeline li time{display:block!important;margin:0!important;font-size:10.5px!important;line-height:1.35!important;color:#74888e!important;white-space:normal!important}#viewRede #p128Timeline .p128-more{width:100%!important;margin-top:10px!important;padding:9px 12px!important}}`;document.head.appendChild(st)}\nfunction boot(){injectCss();polishTimeline();const detail=$('#viewRede #detail');if(detail)new MutationObserver(()=>requestAnimationFrame(polishTimeline)).observe(detail,{childList:true,subtree:true})}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();\n'''
          Path('modules/rede-ui-p157.js').write_text(ui,encoding='utf-8')

          # ---------- Loader: remove competing P154 graph controller ----------
          p=Path('modules/dossier-p132.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("await load('./p135-rede-acompanhamento.js?v=P135-20260919','carbonautas-p135-rede-acompanhamento');","await load('./p135-rede-acompanhamento.js?v=P157-20260919','carbonautas-p135-rede-acompanhamento');")
          s=s.replace("    await load('./modules/rede-orientacao-rede-p154.js?v=P156-20260919','carbonautas-rede-orientacao-rede-p154');\n",'')
          s=s.replace("await load('./modules/rede-ui-p155.js?v=P156-20260919','carbonautas-rede-ui-p155');","await load('./modules/rede-ui-p157.js?v=P157-20260919','carbonautas-rede-ui-p157');")
          p.write_text(s,encoding='utf-8')

          # ---------- Validation report ----------
          report=[]
          idx=Path('index.html').read_text(encoding='utf-8')
          p135=Path('p135-rede-acompanhamento.js').read_text(encoding='utf-8')
          loader=Path('modules/dossier-p132.js').read_text(encoding='utf-8')
          checks={
            'core_orientation_width': 'p157OrientationWidth' in idx,
            'core_separate_force': 'p157ForceWeight' in idx,
            'join_relation_type': "d.relationType||'base'" in idx,
            'orientation_css': '.link.rel-orientation' in idx,
            'production_css': '.link.rel-production' in idx,
            'p135_global_mode': 'window.__p135NetworkMode=mode' in p135,
            'p154_not_loaded': 'rede-orientacao-rede-p154.js' not in loader,
            'p157_ui_loaded': 'rede-ui-p157.js' in loader,
          }
          assert all(checks.values()),checks
          report.extend(f'{k}={v}' for k,v in checks.items())
          report.append('orientation_visual_px=1:3.2,2:5.0,3:6.8,4:8.6,5+:10.4cap')
          report.append('orientation=teal solid; production=purple dashed; projects=green solid')
          Path('p157-validation.txt').write_text('\n'.join(report)+'\n',encoding='utf-8')
          PY
      - name: Syntax checks
        run: |
          node --check p135-rede-acompanhamento.js
          node --check modules/rede-ui-p157.js
          node --check modules/dossier-p132.js
          git diff --check
      - name: Commit repaired branch
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html p135-rede-acompanhamento.js modules/dossier-p132.js modules/rede-ui-p157.js p157-validation.txt
          git commit -m "P157: consolidar motor de relações da Rede" || exit 0
          git push
