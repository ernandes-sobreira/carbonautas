name: P147 remove cronograma repository option
on:
  push:
    branches: [fix/p147-remove-cronograma-repo]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch repository category selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s,n1=re.subn(r'^[ \t]*<option\s+value="cronograma">Cronograma</option>[ \t]*\r?$', '', s, count=1, flags=re.M)
          s,n2=re.subn(r'Object\.entries\(CATEGORIAS\)\.sort\(', "Object.entries(CATEGORIAS).filter(([k])=>k!=='cronograma').sort(", s, count=1)
          print('removed_option',n1,'patched_filter',n2)
          if n1!=1 or n2!=1:
              raise SystemExit('P147 target pattern mismatch')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html
          git commit -m "P147: retirar cronograma das opções do repositório"
          git push
