name: P147 remove cronograma repository option
on:
  push:
    branches: [fix/p147-remove-cronograma-repo]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch repository category selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('          <option value="cronograma">Cronograma</option>\n','',1)
          s=s.replace('Object.entries(CATEGORIAS).sort(',"Object.entries(CATEGORIAS).filter(([k])=>k!=='cronograma').sort(",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html
          git commit -m "P147: retirar cronograma das opções do repositório" || exit 0
          git push
