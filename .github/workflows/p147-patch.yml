name: P147 remove cronograma repository option
on:
  push:
    branches: [fix/p147-remove-cronograma-repo]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch repository category selectors
        run: |
          perl -0pi -e 's#<option value="cronograma">Cronograma</option>##g' index.html
          perl -0pi -e 's#Object\.entries\(CATEGORIAS\)\.sort\(#Object.entries(CATEGORIAS).filter(([k])=>k!=="cronograma").sort(#' index.html
      - name: Commit fix
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1 || true
          git commit -m "P147: retirar cronograma das opções do repositório"
          git push
