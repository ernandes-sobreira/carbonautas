name: P147 remove cronograma repository option
on:
  push:
    branches: [fix/p147-remove-cronograma-repo]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s,n=re.subn(r'\n\s*<option value="cronograma">Cronograma</option>', '', s, count=1)
          if n!=1:
              raise SystemExit(f'expected one cronograma upload option, removed {n}')
          needle='Object.entries(CATEGORIAS).sort('
          repl="Object.entries(CATEGORIAS).filter(([k])=>k!=='cronograma').sort("
          if needle not in s:
              raise SystemExit('refreshPubFilters Object.entries pattern not found')
          s=s.replace(needle,repl,1)
          if s==old:
              raise SystemExit('no change')
          if '<option value="cronograma">Cronograma</option>' in s:
              raise SystemExit('cronograma still selectable in upload modal')
          if "Object.entries(CATEGORIAS).filter(([k])=>k!=='cronograma').sort(" not in s:
              raise SystemExit('cronograma filter exclusion missing')
          if "cronograma:         {label:'Cronograma'" not in s:
              raise SystemExit('legacy cronograma compatibility entry missing')
          p.write_text(s,encoding='utf-8')
          print('P147 validation OK')
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html
          git commit -m "P147: retirar cronograma das opções do repositório" || exit 0
          git push
