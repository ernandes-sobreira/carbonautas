name: P142 home command center
on:
  push:
    branches:
      - fix/p142-home-command-center
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P142 patch
        run: python .github/p142_patch.py
      - name: Validate
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "index.html"
          grep -q 'p142HomeCommandCenterStyle' index.html
          grep -q 'id="dashProductsAllBtn"' index.html
          grep -q 'id="dashNewTaskBtn"' index.html
      - name: Commit
        run: |
          git config user.name 'ernandes-sobreira'
          git config user.email '156730719+ernandes-sobreira@users.noreply.github.com'
          git add index.html
          git commit -m 'P142: redesenhar capa como painel minimalista expansível'
          git push
