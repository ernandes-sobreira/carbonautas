name: P142 home command center
on:
  push:
    branches: [fix/p142-home-command-center]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply P142 safe home redesign
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          scripts_before=re.findall(r'<script\b[^>]*>.*?</script>', s, flags=re.S|re.I)
          old='''      <div class="dash-grid">
        <section class="dash-card"><div class="dash-card-head"><div><h3>⚡ Atenção agora</h3><div class="dash-sub">O que merece ação primeiro.</div></div><div class="spacer"></div><button class="btn" id="dashNewTaskBtn">＋ Pendência</button></div><div class="attention-list" id="dashAttention"></div></section>
        <aside style="display:flex;flex-direction:column;gap:14px">
          <details class="dash-card p140-health-details" style="padding:0;overflow:hidden"><summary style="display:flex;align-items:center;gap:12px;padding:18px;cursor:pointer;list-style:none"><div><h3 style="margin:0">🚦 Saúde dos projetos</h3></div><div class="spacer"></div><span class="btn" style="pointer-events:none">Ver / fechar</span></summary><div style="padding:0 18px 18px"><div class="dash-sub" style="margin-bottom:12px">Verde = em dia; amarelo = atenção; vermelho = intervenção.</div><div id="dashHealth"></div></div></details>
          <section class="dash-card"><div class="dash-card-head"><div><h3>🗓 Check-in mensal</h3><div class="dash-sub">Uma fotografia curta do mês.</div></div></div><div id="dashCheckin"></div></section>
          <section class="dash-card"><div class="dash-card-head"><div><h3>🎯 Produtos e entregas</h3><div class="dash-sub">Artigos, relatórios, eventos, plataformas e outros resultados.</div></div><div class="spacer"></div><button class="btn" id="dashProductsAllBtn">Ver</button></div><div id="dashProducts"></div></section>
        </aside>
      </div>'''
          new='''      <div class="dash-grid p142-home-grid">
        <section class="dash-card p142-command-card" aria-label="Painel rápido">
          <div class="p142-command-intro"><div><span class="p142-eyebrow">SEU PAINEL</span><h3>Abra só o que quiser ver</h3><div class="dash-sub">A capa fica limpa. Os detalhes aparecem quando você pedir.</div></div></div>

          <details class="p142-accordion">
            <summary><span class="p142-icon">⚡</span><span class="p142-label"><b>Atenção agora</b><small>Prazos, correções e pendências.</small></span><span class="p142-toggle"><span class="p142-show">Ver</span><span class="p142-hide">Fechar</span></span></summary>
            <div class="p142-body"><div class="p142-body-actions"><button class="btn" id="dashNewTaskBtn">＋ Pendência</button></div><div class="attention-list" id="dashAttention"></div></div>
          </details>

          <details class="p142-accordion p140-health-details">
            <summary><span class="p142-icon">🚦</span><span class="p142-label"><b>Saúde dos projetos</b><small>Quem está em dia ou precisa de atenção.</small></span><span class="p142-toggle"><span class="p142-show">Ver</span><span class="p142-hide">Fechar</span></span></summary>
            <div class="p142-body"><div class="dash-sub p142-note">Verde = em dia; amarelo = atenção; vermelho = intervenção.</div><div id="dashHealth"></div></div>
          </details>

          <details class="p142-accordion">
            <summary><span class="p142-icon">🎯</span><span class="p142-label"><b>Produtos e entregas</b><small>Artigos, relatórios, eventos e resultados.</small></span><span class="p142-toggle"><span class="p142-show">Ver</span><span class="p142-hide">Fechar</span></span></summary>
            <div class="p142-body"><div class="p142-body-actions"><button class="btn" id="dashProductsAllBtn">Abrir área completa</button></div><div id="dashProducts"></div></div>
          </details>

          <details class="p142-accordion p142-checkin-last">
            <summary><span class="p142-icon">🗓</span><span class="p142-label"><b>Check-in mensal</b><small>Fechamento rápido do mês.</small></span><span class="p142-toggle"><span class="p142-show">Ver</span><span class="p142-hide">Fechar</span></span></summary>
            <div class="p142-body"><div id="dashCheckin"></div></div>
          </details>
        </section>
      </div>'''
          if s.count(old)!=1:
              raise SystemExit(f'expected exactly one dashboard block, found {s.count(old)}')
          s=s.replace(old,new,1)
          css='''
<style id="p142HomeCommandCenterStyle">
  #viewDashboard .p142-home-grid{display:block!important;max-width:860px;margin:0 auto;width:100%}
  #viewDashboard .p142-command-card{padding:8px!important;border-radius:22px;box-shadow:none;background:rgba(255,255,255,.96)}
  #viewDashboard .p142-command-intro{padding:12px 12px 8px}
  #viewDashboard .p142-command-intro h3{margin:3px 0 3px;font-size:19px;letter-spacing:-.02em}
  #viewDashboard .p142-eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--petrol)}
  #viewDashboard .p142-accordion{margin:0;border:0;border-top:1px solid var(--line);background:transparent;border-radius:0;overflow:visible}
  #viewDashboard .p142-accordion:first-of-type{border-top:0}
  #viewDashboard .p142-accordion summary{list-style:none;display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 12px;cursor:pointer;user-select:none}
  #viewDashboard .p142-accordion summary::-webkit-details-marker{display:none}
  #viewDashboard .p142-icon{font-size:22px;line-height:1;width:30px;text-align:center;flex:0 0 30px}
  #viewDashboard .p142-label{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  #viewDashboard .p142-label b{font-size:16px;line-height:1.2;color:var(--ink)}
  #viewDashboard .p142-label small{font-size:12px;line-height:1.3;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #viewDashboard .p142-toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;color:var(--ink-2);flex:0 0 auto}
  #viewDashboard .p142-hide{display:none}
  #viewDashboard .p142-accordion[open] .p142-show{display:none}
  #viewDashboard .p142-accordion[open] .p142-hide{display:inline}
  #viewDashboard .p142-accordion[open]{background:#fbfdfd;border-radius:16px;margin:4px 0;border:1px solid var(--line)}
  #viewDashboard .p142-accordion[open] + .p142-accordion{border-top-color:transparent}
  #viewDashboard .p142-body{padding:0 12px 14px}
  #viewDashboard .p142-body-actions{display:flex;justify-content:flex-end;margin:0 0 10px}
  #viewDashboard .p142-note{margin:0 0 10px}
  #viewDashboard .p142-checkin-last{margin-bottom:0}
  @media(max-width:700px){
    #viewDashboard .p142-home-grid{max-width:none}
    #viewDashboard .p142-command-card{padding:6px!important;border-radius:18px}
    #viewDashboard .p142-command-intro{padding:10px 10px 6px}
    #viewDashboard .p142-command-intro h3{font-size:18px}
    #viewDashboard .p142-accordion summary{min-height:62px;padding:9px 9px;gap:9px}
    #viewDashboard .p142-label b{font-size:15px}
    #viewDashboard .p142-label small{font-size:11px}
    #viewDashboard .p142-toggle{padding:7px 10px}
    #viewDashboard .p142-body{padding:0 9px 12px}
  }
</style>
'''
          if 'id="p142HomeCommandCenterStyle"' in s:
              raise SystemExit('P142 style already present')
          s=s.replace('</head>',css+'</head>',1)
          scripts_after=re.findall(r'<script\b[^>]*>.*?</script>', s, flags=re.S|re.I)
          if scripts_before!=scripts_after:
              raise SystemExit('script contents changed unexpectedly')
          required=['dashNewTaskBtn','dashAttention','dashHealth','dashProductsAllBtn','dashProducts','dashCheckin']
          for rid in required:
              c=s.count(f'id="{rid}"')
              if c!=1:
                  raise SystemExit(f'{rid} count={c}, expected 1')
          if s.index('id="dashCheckin"') < s.index('id="dashProducts"'):
              raise SystemExit('check-in is not last')
          p.write_text(s,encoding='utf-8')
      - name: Validate isolated change
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "index.html"
          grep -q 'p142HomeCommandCenterStyle' index.html
          grep -q 'id="dashProductsAllBtn"' index.html
          grep -q 'id="dashNewTaskBtn"' index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name 'ernandes-sobreira'
          git config user.email '156730719+ernandes-sobreira@users.noreply.github.com'
          git add index.html
          git commit -m 'P142: redesenhar capa como painel minimalista expansível'
          git push
