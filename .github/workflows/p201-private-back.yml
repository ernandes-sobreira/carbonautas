name: P201 private back
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p201-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P201 e validar
        shell: bash
        run: |
          echo '  xKQpub3RlPScnJyMjIyBQMTAxIMK3IDIwMjYtMDktMjAgwrcgVm9sdGFyIGRhcyBjb252ZXJzYXMgcHJpdmFkYXMKLSBPIGJvdMOjbyBkZSB2b2x0YXIgbm8gY2hhdCBwcml2YWRvIGFnb3JhIGZlY2hhIGEgY29udmVyc2EgcGVsbyBmbHV4byBjb21wbGV0byAoYGNsb3NlUHJpdmF0ZVRocmVhZGA ' | tr -d ' ' | base64 -d > /tmp/p201.py
          python3 /tmp/p201.py
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p201-private-back.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P201: corrigir voltar do chat privado [p201-applied]"
          git push
