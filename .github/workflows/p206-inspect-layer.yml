name: P206 inspect acompanhamento layer
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspecionar acompanhamento e modais
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SHA512 INDEX ==='
          sha512sum index.html
          echo '=== TEXTOS VISIVEIS ==='
          grep -n -i -E -C 12 'Situação agora|Situacao agora|Editar cadastro|Desligar acesso|Visão geral|Visao geral|Registrar|Pasta de acompanhamento' index.html || true
          echo '=== P97 / TRACK ==='
          grep -n -i -E -C 8 'p97Deck|p97-playing-card|p97-|viewTrack|track' index.html | tail -n 900 || true
          echo '=== MODAL / OVERLAY / Z-INDEX perto do acompanhamento ==='
          grep -n -i -E -C 5 'z-index|overlay|modal' index.html | tail -n 900 || true
          echo '=== JS EXTERNOS RELEVANTES ==='
          grep -n -i -E -C 5 'p135-rede-acompanhamento|dossier|acompanhamento' index.html | tail -n 500 || true
