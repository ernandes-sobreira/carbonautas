name: P137 repair placement
on:
  push:
    branches: ["fix/access-collapse-2026-09-19"]
    paths: [".github/workflows/diag-p137.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/access-collapse-2026-09-19
      - name: Move P137 to real body end
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- P137 · acessos recolhidos no painel -->'
          a=s.find(marker)
          if a<0:
              raise SystemExit('P137 marker missing')
          script_end=s.find('</script>',a)
          if script_end<0:
              raise SystemExit('P137 script end missing')
          b=script_end+len('</script>')
          block=s[a:b]
          s=s[:a]+s[b:]
          body_end=s.rfind('</body>')
          if body_end<0:
              raise SystemExit('real body end missing')
          s=s[:body_end]+block+'\n\n'+s[body_end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate placement
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          marker='<!-- P137 · acessos recolhidos no painel -->'
          assert s.count(marker)==1
          assert s.find(marker)>s.find("window.CARBONAUTAS_DESKTOP_AGENDA_BUILD=BUILD")
          assert s.find(marker)<s.rfind('</body>')
          assert '#p128Presence .p128-grid{display:none!important' in s
          assert "content:'Ver'" in s
          assert 'p137-access-open' in s
          print('P137 placement OK')
          PY
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script id=\"p137AccessCollapseScript\">([\s\S]*?)<\/script>/);if(!m)process.exit(2);new Function(m[1]);console.log('P137 JS OK')"
      - name: Commit repair
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html
          git commit -m "P137: posicionar recolhimento de acessos no fim da aplicação"
          git push origin HEAD:fix/access-collapse-2026-09-19
