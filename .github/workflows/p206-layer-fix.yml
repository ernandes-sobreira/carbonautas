name: P206 acompanhamento layers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p206-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P206
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function openOverlay(id){$('#'+id).classList.add('open')}"
          if s.count(old)!=1:
              raise SystemExit(f'P206: openOverlay esperado 1 vez, encontrado {s.count(old)}')
          new=r'''function openOverlay(id){
            const el=$('#'+id);if(!el)return;
            const deck=$('#p97Deck'),deckOpen=!!(deck&&!deck.hidden);
            if(deckOpen){
              window.__p206OverlayZ=Math.max(Number(window.__p206OverlayZ)||0,300000)+1;
              el.style.setProperty('z-index',String(window.__p206OverlayZ),'important');
              el.dataset.p206OverDeck='1';
            }else if(el.dataset.p206OverDeck==='1'){
              el.style.removeProperty('z-index');
              delete el.dataset.p206OverDeck;
            }
            el.classList.add('open');
          }'''
          s=s.replace(old,new)
          if s.count("window.CARBONAUTAS_BUILD='P205-20260921';")!=1:
              raise SystemExit('P206: build P205 não encontrado exatamente uma vez')
          s=s.replace("window.CARBONAUTAS_BUILD='P205-20260921';","window.CARBONAUTAS_BUILD='P206-20260921';")
          if s.count("./sw.js?v=P205-20260921")!=1:
              raise SystemExit('P206: registro SW P205 não encontrado exatamente uma vez')
          s=s.replace("./sw.js?v=P205-20260921","./sw.js?v=P206-20260921")
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          if w.count('service worker P205')!=1 or w.count("carbonautas-p205-20260921")!=1:
              raise SystemExit('P206: sw.js não está na versão P205 esperada')
          w=w.replace('service worker P205','service worker P206')
          w=w.replace("carbonautas-p205-20260921","carbonautas-p206-20260921")
          sw.write_text(w,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "window.CARBONAUTAS_BUILD='P206-20260921';" in s
          assert "el.style.setProperty('z-index',String(window.__p206OverlayZ),'important')" in s
          assert "const deck=$('#p97Deck'),deckOpen=!!(deck&&!deck.hidden);" in s
          w=Path('sw.js').read_text(encoding='utf-8')
          assert 'service worker P206' in w
          assert 'carbonautas-p206-20260921' in w
          print('P206 checks OK')
          PY
          rm -f .github/workflows/p206-layer-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/p206-layer-fix.yml
          git commit -m "P206: corrigir ordem das camadas do acompanhamento [p206-applied]"
          git push
