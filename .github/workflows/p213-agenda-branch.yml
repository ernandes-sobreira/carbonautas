name: P213 agenda branch checks
on:
  push:
    branches: [agenda-rebuild-p213]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test tests/agenda-p213.cjs
      - run: node --test tests/agenda-dom-p213.cjs
      - run: node --test tests/agenda-integration-p213.cjs
      - name: Garantir que login e app-base continuam idênticos à P210
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base=subprocess.check_output(['git','show','c0240930b4a30fdbb9b22177777577cccdf252cb:index.html']).decode('utf-8')
          cur=Path('index.html').read_text(encoding='utf-8')
          tags=[
            '<script src="./modules/agenda-core-p213.js?v=P213-20260921"></script>\n',
            '<script src="./modules/agenda-integration-p213.js?v=P213-20260921"></script>\n'
          ]
          stripped=cur
          for tag in tags: stripped=stripped.replace(tag,'')
          assert stripped==base, 'P213 alterou algo no index além de carregar os módulos isolados da Agenda'
          print('Base P210 preservada byte a byte; somente os módulos P213 foram acrescentados.')
          PY
      - name: Agenda static checks
        run: |
          node --check modules/agenda-core-p213.js
          node --check modules/agenda-integration-p213.js
          grep -q 'agenda-core-p213.js' index.html
          grep -q 'agenda-integration-p213.js' index.html
          grep -q 'CARBONAUTAS_AGENDA_P213' modules/agenda-core-p213.js
          grep -q 'CARBONAUTAS_AGENDA_INTEGRATION_P213' modules/agenda-integration-p213.js
          ! grep -q 'P211' index.html
