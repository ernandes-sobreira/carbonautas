name: P195 capa minima passa-card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p195-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P195 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess, sys

          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')

          required=[
            'p194HomeFloatingCardsStyle',
            "window.CARBONAUTAS_BUILD='P194-20260920';",
            "navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})",
            "function relocatePanel(){const host=$('#p117Highlights'),home=$('#viewPainel .p142-home-grid');if(host&&home&&home.previousElementSibling!==host)home.insertAdjacentElement('beforebegin',host)}",
            "const home=$('#viewPainel .p142-home-grid');\n  if(home)home.insertAdjacentElement('beforebegin',host);else $('#viewPainel .dash-wrap')?.prepend(host);"
          ]
          for a in required:
            assert a in s, f'anchor missing: {a[:90]}'
          assert 'p195MinimalHomeStyle' not in s
          assert '</body>' in s

          old_ensure="const home=$('#viewPainel .p142-home-grid');\n  if(home)home.insertAdjacentElement('beforebegin',host);else $('#viewPainel .dash-wrap')?.prepend(host);"
          new_ensure="const mural=$('#viewMural .mural-board'),filter=$('#muralFilterbar');\n  if(mural){if(filter)mural.insertBefore(host,filter);else mural.appendChild(host)}else $('#viewMural')?.appendChild(host);"
          s=s.replace(old_ensure,new_ensure)

          old_reloc="function relocatePanel(){const host=$('#p117Highlights'),home=$('#viewPainel .p142-home-grid');if(host&&home&&home.previousElementSibling!==host)home.insertAdjacentElement('beforebegin',host)}"
          new_reloc="function relocatePanel(){const host=$('#p117Highlights'),mural=$('#viewMural .mural-board'),filter=$('#muralFilterbar');if(!host||!mural)return;if(filter){if(host.parentElement!==mural||host.nextElementSibling!==filter)mural.insertBefore(host,filter)}else if(host.parentElement!==mural)mural.appendChild(host)}"
          s=s.replace(old_reloc,new_reloc)

          old_notif="try{if(typeof window.switchView==='function')window.switchView('painel');else if(typeof switchView==='function')switchView('painel')}catch(_e){}"
          new_notif="try{if(typeof window.switchView==='function')window.switchView('mural');else if(typeof switchView==='function')switchView('mural')}catch(_e){}"
          assert old_notif in s, 'highlight notification target anchor missing'
          s=s.replace(old_notif,new_notif)

          layer=base64.b64decode('; padding-left:8px;padding-right:8px}
#p195FocusDeck .p195-empty{text-align:center;min-height:230px;display:grid;place-items:center}
#p195FocusDeck .p195-empty .p195-empty-icon{font-size:34px;margin-bottom:8px}
#p195FocusDeck .p195-empty b{display:block;font-size:23px;color:#173b49;letter-spacing:-.03em}
#p195FocusDeck .p195-empty span{display:block;font-size:12px;color:#7a8d94;margin-top:5px}

#viewMural #p117Highlights{width:100%!important;max-width:none!important;margin:0 0 14px!important}
#viewMural #p117Highlights .p117-sub{max-width:680px}
@media(max-width:700px){
  #viewPainel .dash-scroll{background:#f6f9f8!important}
  #viewPainel .dash-wrap{padding:18px 12px 92px!important}
  #p195FocusDeck{padding:0}
  #p195FocusDeck .p195-card{min-height:300px;border-radius:26px;padding:24px 20px}
  #p195FocusDeck .p195-foot{display:grid;grid-template-columns:auto 1fr auto;gap:6px}
  #p195FocusDeck .p195-count{grid-column:1/-1;margin:0 0 3px;text-align:center}
  #p195FocusDeck .p195-btn{padding:11px 12px}
}
</style>
<script id="p195MinimalHomeController">
(()=>{
  'use strict';
  const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
  const txt=(s,r)=>String(q(s,r)?.textContent||'').replace(/\s+/g,' ').trim();
  let pos=0,items=[],scheduled=false,observed=new WeakSet();
  const dismissed=()=>{
    try{return new Set(JSON.parse(sessionStorage.getItem('p195Dismissed')||'[]'))}catch(_e){return new Set()}
  };
  const saveDismissed=set=>{try{sessionStorage.setItem('p195Dismissed',JSON.stringify([...set].slice(-100)))}catch(_e){}};
  function keyOf(parts){return norm(parts.filter(Boolean).join('|')).slice(0,700)}
  function collect(){
    const out=[],seen=new Set(),gone=dismissed();
    qa('#dashAttention .p56-task').forEach(el=>{
      const title=txt('.p56-what',el)||txt('.p56-who',el)||'Item para resolver';
      const who=txt('.p56-who',el),detail=txt('.p56-detail',el),date=txt('.p56-date',el),source=txt('.p56-source',el);
      const key=keyOf(['acao',who,title,detail,date]);
      if(!key||seen.has(key)||gone.has(key))return;seen.add(key);
      out.push({key,title,meta:[source,who,date].filter(Boolean).join(' · '),detail,el,kind:'Agora'});
    });
    qa('#p78TodayCard .p78-row').forEach(el=>{
      const title=txt('.p78-main b',el)||'Novidade';
      const detail=txt('.p78-main span',el),tag=txt('.p78-tag',el);
      const key=keyOf(['novidade',title,detail]);
      if(!key||seen.has(key)||gone.has(key))return;seen.add(key);
      out.push({key,title,meta:['Novidade',tag].filter(Boolean).join(' · '),detail,el,kind:'Agora'});
    });
    items=out;
    if(pos>=items.length)pos=0;
  }
  function ensureDeck(){
    const home=q('#viewPainel .p142-home-grid');if(!home)return null;
    let deck=q('#p195FocusDeck');
    if(!deck){
      deck=document.createElement('section');deck.id='p195FocusDeck';deck.setAttribute('aria-live','polite');
      deck.innerHTML='<div class="p195-top"><span class="p195-brand">AGORA</span><div class="p195-menu"><button type="button" class="p195-more" aria-label="Mais ações">⋯</button><div class="p195-sheet"><button type="button" data-p195-action="task">＋ Nova pendência</button><button type="button" data-p195-action="checkin">✓ Check-in</button><button type="button" data-p195-action="product">🎯 Registrar produto</button><button type="button" data-p195-action="dossier">📚 Dossiê</button><button type="button" data-p195-action="backup">📦 Backup</button></div></div></div><div class="p195-card"></div>';
      home.prepend(deck);
      q('.p195-more',deck).onclick=e=>{e.stopPropagation();q('.p195-sheet',deck).classList.toggle('open')};
      q('.p195-sheet',deck).onclick=e=>{
        const b=e.target.closest('[data-p195-action]');if(!b)return;
        const map={task:'#dashNewTaskBtn',checkin:'#dashCheckinBtn',product:'#dashProductBtn',dossier:'#dashDossierBtn',backup:'#dashBackupBtn'};
        const target=q(map[b.dataset.p195Action]);q('.p195-sheet',deck).classList.remove('open');
        if(target&&getComputedStyle(target).display!=='none')target.click();else if(target)target.click();
      };
      document.addEventListener('click',e=>{if(!e.target.closest('#p195FocusDeck .p195-menu'))q('.p195-sheet',deck)?.classList.remove('open')});
    }
    const backup=q('[data-p195-action="backup"]',deck),src=q('#dashBackupBtn');
    if(backup)backup.style.display=src&&getComputedStyle(src).display!=='none'?'block':'none';
    return deck;
  }
  function openItem(it){
    if(!it?.el)return;
    if(it.el.matches('.p78-row')){it.el.click();return}
    const buttons=qa('.p56-task-actions button',it.el);
    const open=buttons.find(b=>!/concluir|já tratei|ja tratei/i.test(b.textContent||''))||buttons[0];
    open?.click();
  }
  function render(){
    scheduled=false;const deck=ensureDeck();if(!deck)return;
    collect();const card=q('.p195-card',deck);if(!card)return;
    if(!items.length){
      card.innerHTML='<div class="p195-empty"><div><div class="p195-empty-icon">✓</div><b>Tudo certo por aqui.</b><span>Nada pedindo sua atenção agora.</span></div></div>';
      return;
    }
    const it=items[pos]||items[0],more=items.length>1;
    card.innerHTML=`<div><div class="p195-kicker"><i></i>${it.kind}</div><div class="p195-title"></div><div class="p195-meta"></div><div class="p195-detail"></div></div><div class="p195-foot"><span class="p195-count">${pos+1} de ${items.length}</span><button type="button" class="p195-btn ghost" data-p195-dismiss>Dispensar</button><button type="button" class="p195-btn" data-p195-next ${more?'':'hidden'}>Passar →</button><button type="button" class="p195-btn primary" data-p195-open>Abrir</button></div>`;
    q('.p195-title',card).textContent=it.title;
    q('.p195-meta',card).textContent=it.meta;
    q('.p195-detail',card).textContent=it.detail||'Toque em Abrir para ver o contexto.';
    q('[data-p195-open]',card).onclick=()=>openItem(it);
    const next=q('[data-p195-next]',card);if(next)next.onclick=()=>{pos=(pos+1)%items.length;render()};
    q('[data-p195-dismiss]',card).onclick=()=>{
      const set=dismissed();set.add(it.key);saveDismissed(set);collect();if(pos>=items.length)pos=0;render();
    };
  }
  function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(render)}
  function observeSources(){
    ['#dashAttention','#p78TodayCard'].forEach(sel=>{const el=q(sel);if(el&&!observed.has(el)){observed.add(el);new MutationObserver(schedule).observe(el,{childList:true,subtree:true,characterData:true})}});
  }
  function boot(){
    ensureDeck();observeSources();schedule();
    let tries=0;const timer=setInterval(()=>{tries++;observeSources();schedule();if((q('#dashAttention')&&q('#p78TodayCard'))||tries>=16)clearInterval(timer)},350);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
').decode('utf-8')
          head,tail=s.rsplit('</body>',1)
          s=head+layer+'\n</body>'+tail

          s=s.replace("window.CARBONAUTAS_BUILD='P194-20260920';","window.CARBONAUTAS_BUILD='P195-20260920';")
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})","navigator.serviceWorker.register('./sw.js?v=P195-20260920',{updateViaCache:'none'})")
          assert 'p195MinimalHomeStyle' in s
          assert "window.CARBONAUTAS_BUILD='P195-20260920';" in s
          idx.write_text(s,encoding='utf-8')

          sw=Path('sw.js'); t=sw.read_text(encoding='utf-8')
          assert 'service worker P194' in t and "const CACHE='carbonautas-p194-20260920';" in t
          t=t.replace('service worker P194','service worker P195').replace("const CACHE='carbonautas-p194-20260920';","const CACHE='carbonautas-p195-20260920';")
          sw.write_text(t,encoding='utf-8')

          readme=Path('README.md'); r=readme.read_text(encoding='utf-8')
          assert 'Todas as camadas P44 a P194 estao dentro dele' in r
          marker='### P194 · 2026-09-20 · Home em cards flutuantes'
          assert marker in r
          r=r.replace('Todas as camadas P44 a P194 estao dentro dele','Todas as camadas P44 a P195 estao dentro dele')
          sec='''### P195 · 2026-09-20 · Capa mínima em passa-card
- A capa passa a mostrar um único card flutuante por vez, alimentado pelas pendências e novidades já existentes.
- “Passar” avança para o próximo card; “Dispensar” tira somente da capa durante a sessão, sem concluir nem apagar o item real.
- Atalhos duplicados de Mural, Agenda, Repositório e Pessoas saem da capa.
- “Precisa de você” e “Só acompanhar” deixam de aparecer como blocos duplicados e viram uma única fila visual.
- O hero “O que precisa da minha atenção?” e os KPIs deixam de aparecer na capa.
- Destaques do mês saem da capa e passam para “Ó nóis!” (Mural), antes dos filtros.
- Ações menos frequentes ficam atrás do botão “⋯”.
- Não alterado: dados, regras do Firebase, VPS, permissões ou conteúdo das pendências.

'''
          r=r.replace(marker,sec+marker)
          readme.write_text(r,encoding='utf-8')

          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')

          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p195-{i}.mjs'); p.write_text(b,encoding='utf-8')
            z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode:
              print(f'JS block {i} failed\n{z.stderr}')
              sys.exit(1)
          print(f'Validated {len(blocks)} inline script blocks')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p195-minimal-home.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P195: capa minima em passa-card [p195-applied]"
          git push
