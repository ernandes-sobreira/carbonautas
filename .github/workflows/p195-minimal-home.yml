name: P195 capa minima passa-card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p195-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P195 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,sys
          idx=Path('index.html'); s=idx.read_text(encoding='utf-8')
          required=['p194HomeFloatingCardsStyle',"window.CARBONAUTAS_BUILD='P194-20260920';","navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})"]
          for a in required: assert a in s, f'anchor missing: {a}'
          assert 'p195MinimalHomeStyle' not in s

          old="const home=$('#viewPainel .p142-home-grid');\n  if(home)home.insertAdjacentElement('beforebegin',host);else $('#viewPainel .dash-wrap')?.prepend(host);"
          new="const mural=$('#viewMural .mural-board'),filter=$('#muralFilterbar');\n  if(mural){if(filter)mural.insertBefore(host,filter);else mural.appendChild(host)}else $('#viewMural')?.appendChild(host);"
          assert old in s; s=s.replace(old,new)
          old="function relocatePanel(){const host=$('#p117Highlights'),home=$('#viewPainel .p142-home-grid');if(host&&home&&home.previousElementSibling!==host)home.insertAdjacentElement('beforebegin',host)}"
          new="function relocatePanel(){const host=$('#p117Highlights'),mural=$('#viewMural .mural-board'),filter=$('#muralFilterbar');if(!host||!mural)return;if(filter){if(host.parentElement!==mural||host.nextElementSibling!==filter)mural.insertBefore(host,filter)}else if(host.parentElement!==mural)mural.appendChild(host)}"
          assert old in s; s=s.replace(old,new)
          old="try{if(typeof window.switchView==='function')window.switchView('painel');else if(typeof switchView==='function')switchView('painel')}catch(_e){}"
          new="try{if(typeof window.switchView==='function')window.switchView('mural');else if(typeof switchView==='function')switchView('mural')}catch(_e){}"
          assert old in s; s=s.replace(old,new)

          layer=r'''<style id="p195MinimalHomeStyle">
#viewPainel .dash-hero,#viewPainel #dashKpis,#viewPainel #p194Welcome,#viewPainel #p194Shortcuts,#viewPainel #p194FooterLinks{display:none!important}
#viewPainel .p142-home-grid{display:block!important;width:100%!important;margin:0!important}
#viewPainel .p142-home-grid>*{display:none!important}
#viewPainel #p195Deck{display:block!important}
#viewPainel .dash-wrap{max-width:760px!important;margin:auto!important;padding-top:clamp(18px,5vh,52px)!important}
#viewPainel #p192AboutFooter{display:flex!important;padding:22px 8px 28px!important}
#p195Deck{max-width:640px;margin:auto}
#p195Deck .p195-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 12px;color:#71878f;font-size:10px;font-weight:950;letter-spacing:.14em}
#p195Deck details{position:relative}
#p195Deck details summary{list-style:none;width:38px;height:38px;display:grid;place-items:center;border:1px solid #d9e6e4;border-radius:50%;background:#fff;font-size:20px;cursor:pointer}
#p195Deck details summary::-webkit-details-marker{display:none}
#p195Deck .p195-tools{position:absolute;right:0;top:44px;z-index:30;width:230px;padding:6px;border:1px solid #d8e5e3;border-radius:16px;background:#fff;box-shadow:0 20px 50px rgba(18,56,64,.16)}
#p195Deck .p195-tools button{display:block;width:100%;border:0;background:transparent;padding:10px 11px;border-radius:10px;text-align:left;font-size:12px;font-weight:800;color:#294a55}
#p195Deck .p195-tools button:hover{background:#f0f7f5}
#p195Deck .p195-card{min-height:280px;padding:clamp(22px,5vw,34px);border:1px solid #d9e7e4;border-radius:30px;background:#fff;box-shadow:0 26px 80px rgba(17,55,64,.13);display:flex;flex-direction:column;justify-content:space-between}
#p195Deck .p195-k{font-size:10px;font-weight:950;letter-spacing:.12em;color:#148087}
#p195Deck .p195-title{font:700 clamp(24px,4vw,34px)/1.07 'Space Grotesk','Inter',sans-serif;letter-spacing:-.04em;color:#153a49;margin:14px 0 8px}
#p195Deck .p195-meta{font-size:11px;font-weight:800;color:#71858d;margin-bottom:8px}
#p195Deck .p195-detail{font-size:13px;line-height:1.5;color:#5e737b}
#p195Deck .p195-foot{display:flex;gap:7px;align-items:center;margin-top:24px}
#p195Deck .p195-count{margin-right:auto;font-size:10px;font-weight:900;color:#89999e}
#p195Deck .p195-btn{border:1px solid #d6e4e1;background:#fff;color:#31525d;border-radius:999px;padding:10px 13px;font-size:11px;font-weight:900}
#p195Deck .p195-btn.primary{background:#0e6f78;border-color:#0e6f78;color:#fff}
#p195Deck .p195-btn.ghost{border-color:transparent;color:#809097}
#p195Deck .p195-empty{text-align:center;margin:auto;color:#789099}
#p195Deck .p195-empty b{display:block;font-size:24px;color:#173b49;margin-bottom:5px}
#viewMural #p117Highlights{width:100%!important;max-width:none!important;margin:0 0 14px!important}
@media(max-width:700px){#viewPainel .dash-wrap{padding:18px 12px 90px!important}#p195Deck .p195-card{min-height:310px;padding:24px 20px;border-radius:26px}#p195Deck .p195-foot{flex-wrap:wrap}#p195Deck .p195-count{width:100%;text-align:center;margin:0 0 4px}}
</style>
<script id="p195MinimalHomeController">
(()=>{'use strict';
const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)],t=(s,r)=>String(q(s,r)?.textContent||'').replace(/\s+/g,' ').trim(),n=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
let pos=0,obs=new WeakSet(),timer;
const gone=()=>{try{return new Set(JSON.parse(sessionStorage.getItem('p195Gone')||'[]'))}catch(e){return new Set()}};
const save=x=>{try{sessionStorage.setItem('p195Gone',JSON.stringify([...x]))}catch(e){}};
function collect(){const a=[],seen=new Set(),g=gone(),add=o=>{o.key=n([o.title,o.meta,o.detail].join('|'));if(!o.key||g.has(o.key)||seen.has(o.key))return;seen.add(o.key);a.push(o)};
qa('#dashAttention .p56-task').forEach(el=>add({title:t('.p56-what',el)||t('.p56-who',el)||'Item para resolver',meta:[t('.p56-source',el),t('.p56-who',el),t('.p56-date',el)].filter(Boolean).join(' · '),detail:t('.p56-detail',el),el}));
qa('#p78TodayCard .p78-row').forEach(el=>add({title:t('.p78-main b',el)||'Novidade',meta:['Novidade',t('.p78-tag',el)].filter(Boolean).join(' · '),detail:t('.p78-main span',el),el}));return a}
function action(id){const x=q(id);if(x)x.click()}
function ensure(){const home=q('#viewPainel .p142-home-grid');if(!home)return null;let d=q('#p195Deck');if(d)return d;d=document.createElement('section');d.id='p195Deck';d.innerHTML='<div class="p195-head"><span>AGORA</span><details><summary aria-label="Mais ações">⋯</summary><div class="p195-tools"><button data-a="task">＋ Nova pendência</button><button data-a="checkin">✓ Check-in</button><button data-a="product">🎯 Registrar produto</button><button data-a="dossier">📚 Dossiê</button><button data-a="backup">📦 Backup</button></div></details></div><div class="p195-card"></div>';home.prepend(d);d.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;({task:()=>action('#dashNewTaskBtn'),checkin:()=>action('#dashCheckinBtn'),product:()=>action('#dashProductBtn'),dossier:()=>action('#dashDossierBtn'),backup:()=>action('#dashBackupBtn')})[b.dataset.a]?.();b.closest('details')?.removeAttribute('open')};return d}
function open(it){if(it.el.matches('.p78-row'))return it.el.click();const bs=qa('.p56-task-actions button',it.el),b=bs.find(x=>!/concluir|já tratei|ja tratei/i.test(x.textContent||''))||bs[0];b?.click()}
function render(){const d=ensure();if(!d)return;const a=collect(),card=q('.p195-card',d),backup=q('[data-a="backup"]',d),src=q('#dashBackupBtn');if(backup)backup.style.display=src&&getComputedStyle(src).display!=='none'?'block':'none';if(pos>=a.length)pos=0;if(!a.length){card.innerHTML='<div class="p195-empty"><b>✓ Tudo certo.</b><span>Nada pedindo sua atenção agora.</span></div>';return}const it=a[pos];card.innerHTML='<div><div class="p195-k">AGORA</div><div class="p195-title"></div><div class="p195-meta"></div><div class="p195-detail"></div></div><div class="p195-foot"><span class="p195-count"></span><button class="p195-btn ghost" data-g>Dispensar</button><button class="p195-btn" data-n>Passar →</button><button class="p195-btn primary" data-o>Abrir</button></div>';q('.p195-title',card).textContent=it.title;q('.p195-meta',card).textContent=it.meta;q('.p195-detail',card).textContent=it.detail||'Abra para ver o contexto.';q('.p195-count',card).textContent=(pos+1)+' de '+a.length;q('[data-n]',card).style.display=a.length>1?'':'none';q('[data-o]',card).onclick=()=>open(it);q('[data-n]',card).onclick=()=>{pos=(pos+1)%a.length;render()};q('[data-g]',card).onclick=()=>{const g=gone();g.add(it.key);save(g);render()}}
function watch(){['#dashAttention','#p78TodayCard'].forEach(s=>{const el=q(s);if(el&&!obs.has(el)){obs.add(el);new MutationObserver(render).observe(el,{childList:true,subtree:true,characterData:true})}})}
function boot(){ensure();watch();render();let k=0;timer=setInterval(()=>{watch();render();if(++k>14||(q('#dashAttention')&&q('#p78TodayCard')))clearInterval(timer)},350)}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot,{once:true}):boot();
})();
</script>'''
          head,tail=s.rsplit('</body>',1);s=head+layer+'\n</body>'+tail
          s=s.replace("window.CARBONAUTAS_BUILD='P194-20260920';","window.CARBONAUTAS_BUILD='P195-20260920';")
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})","navigator.serviceWorker.register('./sw.js?v=P195-20260920',{updateViaCache:'none'})")
          idx.write_text(s,encoding='utf-8')

          sw=Path('sw.js');t=sw.read_text(encoding='utf-8');assert 'service worker P194' in t and "carbonautas-p194-20260920" in t;t=t.replace('service worker P194','service worker P195').replace('carbonautas-p194-20260920','carbonautas-p195-20260920');sw.write_text(t,encoding='utf-8')
          rm=Path('README.md');r=rm.read_text(encoding='utf-8');assert 'Todas as camadas P44 a P194 estao dentro dele' in r and '### P194 · 2026-09-20 · Home em cards flutuantes' in r;r=r.replace('Todas as camadas P44 a P194 estao dentro dele','Todas as camadas P44 a P195 estao dentro dele');r=r.replace('### P194 · 2026-09-20 · Home em cards flutuantes','### P195 · 2026-09-20 · Capa mínima em passa-card\n- Um único card flutuante por vez reúne pendências e novidades.\n- Passar avança; Dispensar só tira da capa durante a sessão.\n- Saem da capa os atalhos duplicados, os blocos repetidos, o hero e os KPIs.\n- Destaques do mês passam para Ó nóis! (Mural), antes dos filtros.\n- Ações secundárias ficam atrás do botão ⋯.\n- Não alterado: dados, regras, VPS ou permissões.\n\n### P194 · 2026-09-20 · Home em cards flutuantes');rm.write_text(r,encoding='utf-8')
          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p195-{i}.mjs');p.write_text(b,encoding='utf-8');z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode: print(z.stderr);sys.exit(1)
          print('validated',len(blocks),'script blocks')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p195-minimal-home.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P195: capa minima em passa-card [p195-applied]"
          git push
