name: P195 capa minima passa-card
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p195-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P195 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib,re,subprocess,sys
          idx=Path('index.html');s=idx.read_text(encoding='utf-8')
          for a in ['p194HomeFloatingCardsStyle',"window.CARBONAUTAS_BUILD='P194-20260920';","navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})"]: assert a in s,a
          assert 'p195MinimalHomeStyle' not in s
          old="const home=$('#viewPainel .p142-home-grid');\n  if(home)home.insertAdjacentElement('beforebegin',host);else $('#viewPainel .dash-wrap')?.prepend(host);"
          new="const mural=$('#viewMural .mural-board'),filter=$('#muralFilterbar');\n  if(mural){if(filter)mural.insertBefore(host,filter);else mural.appendChild(host)}else $('#viewMural')?.appendChild(host);"
          assert old in s;s=s.replace(old,new)
          old="function relocatePanel(){const host=$('#p117Highlights'),home=$('#viewPainel .p142-home-grid');if(host&&home&&home.previousElementSibling!==host)home.insertAdjacentElement('beforebegin',host)}"
          new="function relocatePanel(){const host=$('#p117Highlights'),mural=$('#viewMural .mural-board'),filter=$('#muralFilterbar');if(!host||!mural)return;if(filter){if(host.parentElement!==mural||host.nextElementSibling!==filter)mural.insertBefore(host,filter)}else if(host.parentElement!==mural)mural.appendChild(host)}"
          assert old in s;s=s.replace(old,new)
          old="try{if(typeof window.switchView==='function')window.switchView('painel');else if(typeof switchView==='function')switchView('painel')}catch(_e){}"
          new="try{if(typeof window.switchView==='function')window.switchView('mural');else if(typeof switchView==='function')switchView('mural')}catch(_e){}"
          assert old in s;s=s.replace(old,new)
          layer=zlib.decompress(base64.b64decode('')).decode('utf-8')
          head,tail=s.rsplit('</body>',1);s=head+layer+'\n</body>'+tail
          s=s.replace("window.CARBONAUTAS_BUILD='P194-20260920';","window.CARBONAUTAS_BUILD='P195-20260920';").replace("navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})","navigator.serviceWorker.register('./sw.js?v=P195-20260920',{updateViaCache:'none'})")
          idx.write_text(s,encoding='utf-8')
          sw=Path('sw.js');t=sw.read_text(encoding='utf-8');assert 'service worker P194' in t and 'carbonautas-p194-20260920' in t;sw.write_text(t.replace('service worker P194','service worker P195').replace('carbonautas-p194-20260920','carbonautas-p195-20260920'),encoding='utf-8')
          rm=Path('README.md');r=rm.read_text(encoding='utf-8');assert 'Todas as camadas P44 a P194 estao dentro dele' in r and '### P194 · 2026-09-20 · Home em cards flutuantes' in r;r=r.replace('Todas as camadas P44 a P194 estao dentro dele','Todas as camadas P44 a P195 estao dentro dele').replace('### P194 · 2026-09-20 · Home em cards flutuantes','### P195 · 2026-09-20 · Capa mínima em passa-card\n- Um único card flutuante por vez reúne pendências e novidades.\n- Passar avança; Dispensar só tira da capa durante a sessão.\n- Saem da capa os atalhos duplicados, os blocos repetidos, o hero e os KPIs.\n- Destaques do mês passam para Ó nóis! (Mural), antes dos filtros.\n- Ações secundárias ficam atrás do botão ⋯.\n- Não alterado: dados, regras, VPS ou permissões.\n\n### P194 · 2026-09-20 · Home em cards flutuantes');rm.write_text(r,encoding='utf-8')
          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p195-{i}.mjs');p.write_text(b,encoding='utf-8');z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode: print(z.stderr);sys.exit(1)
          print('validated',len(blocks),'script blocks')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p195-minimal-home.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P195: capa minima em passa-card [p195-applied]"
          git push
