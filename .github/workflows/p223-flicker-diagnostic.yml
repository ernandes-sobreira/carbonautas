name: P223 Flicker diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-flicker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact boot transitions
        shell: bash
        run: |
          echo '=== BOOTSTRAP FUNCTION ==='
          grep -n -A 140 -B 8 -E '^async function bootstrap\(' index.html || true
          echo '=== ALL AUTH/LOADING CLASS TOGGLES ==='
          grep -n -C 6 -E "authGate.*classList|loading.*classList|classList.*authGate|classList.*loading|#authGate|#loading" index.html || true
          echo '=== DYNAMIC FAVICON FULL BLOCK ==='
          grep -n -A 80 -B 4 -E 'carbonautas-dynamic-favicon' index.html || true
          echo '=== P95/P96 ENTRY RUNTIME ==='
          grep -n -A 100 -B 8 -E 'carbonautasEntryP95|P96 nomes|function decorateEntry\(' index.html || true
