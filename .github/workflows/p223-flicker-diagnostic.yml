name: P223 Fix entry flicker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-entry-flicker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply atomic boot transition
        shell: bash
        run: |
          echo ' ygKCJ}' | base64 -d >/tmp/p223_fix.py
          python /tmp/p223_fix.py
      - name: Commit stable entry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "P223: eliminar pisca-pisca na entrada"
          git push
