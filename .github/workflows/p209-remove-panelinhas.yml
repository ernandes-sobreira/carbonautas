name: P209 remover panelinhas
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p209-done]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retirar panelinhas por completo da interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Troca de versão/cache.
          s=s.replace("window.CARBONAUTAS_BUILD='P208-20260921';","window.CARBONAUTAS_BUILD='P209-20260921';")
          s=s.replace("./sw.js?v=P208-20260921","./sw.js?v=P209-20260921")

          # CSS carregado cedo: nenhum controle de panelinha chega a piscar.
          kill_css='''\n<style id="p209-panelinhas-off">\n/* P209: Panelinhas desativadas. Fofoca geral e Privadas permanecem. */\n#subNav .p46-panel-btn,\n#p46NewGroup,\n#p48New,\n#p48GroupsRoot,\n#p46GroupOverlay,\n#p48GroupOverlay{display:none!important;visibility:hidden!important;pointer-events:none!important}\nbody.p98-panel-active #viewMensagens{pointer-events:auto!important}\n</style>\n'''
          if 'id="p209-panelinhas-off"' not in s:
              if '</head>' not in s: raise SystemExit('P209: </head> não encontrado')
              s=s.replace('</head>',kill_css+'</head>',1)

          # Kill switch final: encerra o estado interno antigo, remove recriações e limpa a seção lateral.
          kill_js=r'''\n<script id="p209-panelinhas-off-js">\n(function(){\n'use strict';\nif(window.__CARBONAUTAS_P209_NO_PANELINHAS)return;\nwindow.__CARBONAUTAS_P209_NO_PANELINHAS=true;\nlet cleaning=false;\nfunction cleanPanelinhas(){\n  if(cleaning)return; cleaning=true;\n  try{\n    try{ if(typeof window.closePanelinhas==='function') window.closePanelinhas(); }catch(_e){}\n    document.body.classList.remove('p98-panel-active');\n    document.body.removeAttribute('data-p48-groups');\n\n    const hadRoot=!!document.querySelector('#p48GroupsRoot');\n    document.querySelectorAll('#subNav .p46-panel-btn,#p48GroupsRoot,#p46GroupOverlay,#p48GroupOverlay').forEach(n=>n.remove());\n\n    const side=document.querySelector('#p46SideList');\n    if(side){\n      const direct=[...side.children];\n      const idx=direct.findIndex(n=>/CONVERSAS\\s+EM\\s+PANELINHA/i.test((n.textContent||'').trim()));\n      if(idx>=0) direct.slice(idx).forEach(n=>n.remove());\n      side.querySelectorAll('#p46NewGroup').forEach(n=>n.remove());\n      [...side.querySelectorAll('*')].forEach(n=>{\n        const t=(n.textContent||'').trim();\n        if(/^Nenhuma panelinha/i.test(t)||/^\\+?\\s*Nova panelinha$/i.test(t)) n.remove();\n      });\n    }\n\n    document.querySelectorAll('#p46NewGroup,#p48New').forEach(n=>n.remove());\n\n    // Se algum controlador antigo chegou a substituir Fofoca geral pela shell P48, restaura Fofoca geral.\n    if(hadRoot && document.body.dataset.view==='mensagens' && typeof window.openGeneralChat==='function'){\n      try{window.openGeneralChat()}catch(_e){}\n    }\n\n    // De agora em diante chamadas antigas não reabrem a funcionalidade removida.\n    window.openPanelinhas=function(){\n      document.body.classList.remove('p98-panel-active');\n      document.body.removeAttribute('data-p48-groups');\n      if(typeof window.openGeneralChat==='function') try{window.openGeneralChat()}catch(_e){}\n    };\n    window.openNewPanelinha=window.openPanelinhas;\n  } finally { cleaning=false; }\n}\n\nfunction boot(){\n  cleanPanelinhas();\n  const mo=new MutationObserver(()=>queueMicrotask(cleanPanelinhas));\n  mo.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','data-p48-groups','data-view']});\n  document.addEventListener('click',e=>{\n    const bad=e.target.closest?.('.p46-panel-btn,#p46NewGroup,#p48New');\n    if(bad){e.preventDefault();e.stopImmediatePropagation();cleanPanelinhas()}\n  },true);\n  console.info('Carbonautas P209 · Panelinhas removidas; Fofoca geral + Privadas preservadas');\n}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();\n</script>\n'''
          if 'id="p209-panelinhas-off-js"' not in s:
              if '</body>' not in s: raise SystemExit('P209: </body> não encontrado')
              s=s.replace('</body>',kill_js+'</body>',1)

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace('service worker P208','service worker P209').replace("carbonautas-p208-20260921","carbonautas-p209-20260921")
          sw.write_text(w,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          w=Path('sw.js').read_text(encoding='utf-8')
          assert 'p209-panelinhas-off' in s
          assert 'p209-panelinhas-off-js' in s
          assert "window.CARBONAUTAS_BUILD='P209-20260921';" in s
          assert './sw.js?v=P209-20260921' in s
          assert 'service worker P209' in w and 'carbonautas-p209-20260921' in w
          print('P209 checks OK')
          PY

          rm -f .p208-panelinhas-report.txt
          rm -f .github/workflows/p209-remove-panelinhas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P209: remover panelinhas e estabilizar conversas [p209-done]"
          git push