name: Validate P152 orientation lines
on:
  push:
    branches: [fix/p152-orientation-weight-lines]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          node --check modules/rede-orientacao-linhas-p152.js
          node --check modules/rede-orientacao-p150.js
      - name: Scope check
        run: |
          grep -q "widthFor" modules/rede-orientacao-linhas-p152.js
          grep -q "Math.min(2.0" modules/rede-orientacao-linhas-p152.js
          grep -q "currentMode()!=='all'" modules/rede-orientacao-linhas-p152.js
          grep -q "rede-orientacao-linhas-p152.js?v=P152-20260919" modules/dossier-p132.js
