name: P138 collapse watch section
on:
  push:
    branches:
      - fix/p138-watch-collapse
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p138-watch-collapse
      - name: Apply patch
        run: python tools/p138_patch.py
      - name: Validate
        run: |
          git diff --check
          grep -q 'p138-watch-section' index.html
          grep -q 'p138-watch-toggle' index.html
          grep -q "Só acompanhar" index.html
      - name: Commit
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html
          git commit -m "P138: recolher Só acompanhar no painel"
          git push origin HEAD:fix/p138-watch-collapse
