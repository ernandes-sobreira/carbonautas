name: P129 remove Jogo e Medalhas da interface

on:
  push:
    branches:
      - P129-menu-cleanup-hotfix

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remover Jogo e Medalhas da interface sem apagar dados
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'p129-hide-game-medals-final'

          if marker in s:
              print('Hotfix já aplicado; nada a fazer.')
              raise SystemExit(0)

          patch = r'''
          <!-- P129 · interface enxuta: Jogo e Medalhas fora da navegação; dados históricos preservados -->
          <style id="p129-hide-game-medals-final">
          .app-nav-card[data-app-view="medalhas"],
          .app-nav-card[data-app-view="jogo"],
          .tab[data-view="medalhas"],
          .tab[data-view="jogo"],
          #dashMedalsBtn,
          #dashGameBtn,
          #viewMedalhas,
          #viewJogo{display:none!important}
          </style>
          <script id="p129-hide-game-medals-final-script">
          (function(){
            'use strict';
            const blocked=new Set(['medalhas','jogo']);
            function clean(){
              document.querySelectorAll('.app-nav-card[data-app-view="medalhas"],.app-nav-card[data-app-view="jogo"],.tab[data-view="medalhas"],.tab[data-view="jogo"],#dashMedalsBtn,#dashGameBtn').forEach(el=>el.remove());
              const v=document.body?.dataset?.view;
              if(blocked.has(v)&&typeof window.switchView==='function'){
                try{window.switchView('painel')}catch(_e){}
              }
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean,{once:true});else clean();
            window.addEventListener('load',clean,{once:true});
            console.info('Carbonautas P129: Jogo e Medalhas removidos da interface; dados preservados.');
          })();
          </script>
          '''

          if '</body>' not in s:
              raise SystemExit('ERRO: </body> não encontrado. Nada alterado.')

          s = s.replace('</body>', patch + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('Hotfix inserido em index.html.')
          PY

      - name: Validar alteração
        shell: bash
        run: |
          grep -q 'p129-hide-game-medals-final' index.html
          echo 'Validação OK.'

      - name: Commit e push em main
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Sem mudanças.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'P129: retirar jogo e medalhas da interface, preservar dados'
          git push origin HEAD:main
