name: P148 inspect Rede settings
on:
  push:
    branches: [fix/p148-remove-ajustes-rede]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant Rede settings code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['Ajustes da Rede','⚙ Ajustes','p135RedeSettings','Filtros da Rede','graph-controls']
          out=[]
          for needle in needles:
              out.append(f'### {needle}')
              pos=0; n=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  n+=1
                  out.append(s[max(0,i-900):min(len(s),i+1800)])
                  out.append('\n---\n')
                  pos=i+len(needle)
              out.append(f'count={n}\n')
          Path('p148-inspect.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add p148-inspect.txt
          git commit -m "chore: inspect P148 Rede settings" || exit 0
          git push
