name: P205 panelinhas
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p205-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P205
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha512sum index.html | awk '{print $1}')" = "8d962910732c750e887e9cc3f0db5b9939616405923a4f3f05a2af386f3379945d92655c964efb45d9f2b9e2387b5a9b047b25da285ffb231b7377b91d5fca61"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start_marker = "async function createGroup(){const name=norm($('#p48Name')?.value)"
          end_marker = "\nfunction showRulesWarning()"
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('P205: função P48 createGroup não encontrada')
          old = s[start:end]
          if old.count("rede_group_threads") != 1 or "p48GroupOverlay" not in old:
              raise SystemExit('P205: bloco P48 inesperado; abortando sem alterar')

          new = r'''async function createGroup(){
            const name=norm($('#p48Name')?.value);
            if(!name)return toast('Dê um nome para a panelinha.');
            const ids=Array.from(document.querySelectorAll('#p48People input:checked')).map(x=>x.value);
            if(!ids.includes(myMemberId))ids.push(myMemberId);
            const uniq=[...new Set(ids)];
            if(uniq.length<2)return toast('Escolha pelo menos mais uma pessoa.');
            if(uniq.length>60)return toast('Uma panelinha pode ter até 60 participantes.');
            const meM=member(myMemberId),groupName=name.slice(0,80),createdByName=meM?.nome||me?.nome||'Carbonauta',btn=$('#p48Create');
            if(btn){btn.disabled=true;btn.textContent='Criando…'}
            try{
              const ref=await f().addDoc(f().collection(window.db,'rede_group_threads'),{groupName,memberIds:uniq,createdByUid:window.auth.currentUser.uid,createdByMemberId:myMemberId,createdByName,active:true,createdAt:f().serverTimestamp(),updatedAt:f().serverTimestamp()});
              const localThread={id:ref.id,groupName,memberIds:uniq,createdByUid:window.auth.currentUser.uid,createdByMemberId:myMemberId,createdByName,active:true,lastMessage:'',createdAt:{toMillis:()=>Date.now()},updatedAt:{toMillis:()=>Date.now()}};
              threads=[localThread,...threads.filter(x=>x.id!==ref.id)];
              $('#p48GroupOverlay').style.display='none';
              activeThreadId=ref.id;
              mount();renderList();renderHead();renderMessages();subscribeMessages(ref.id);
              $('#p48Shell')?.classList.add('chat-open');
              toast('Panelinha criada.');
              setTimeout(()=>{subscribe().catch(e=>console.warn('P205 resubscribe',e))},300);
            }catch(e){
              console.error('P48 create group',e);showRulesWarning();
              toast(e?.code==='permission-denied'?'O Firestore recusou a criação. Falta publicar as regras atuais.':'Não consegui criar a panelinha: '+(e?.message||'erro desconhecido'));
            }finally{
              if(btn){btn.disabled=false;btn.textContent='Criar panelinha'}
            }
          }'''
          s = s[:start] + new + s[end:]

          if s.count("window.CARBONAUTAS_BUILD='P204-20260921';") != 1:
              raise SystemExit('P205: marcador de build P204 não encontrado exatamente uma vez')
          s = s.replace("window.CARBONAUTAS_BUILD='P204-20260921';", "window.CARBONAUTAS_BUILD='P205-20260921';")
          if s.count("./sw.js?v=P204-20260921") != 1:
              raise SystemExit('P205: registro SW P204 não encontrado exatamente uma vez')
          s = s.replace("./sw.js?v=P204-20260921", "./sw.js?v=P205-20260921")
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          if w.count('service worker P204') != 1 or w.count("carbonautas-p204-20260921") != 1:
              raise SystemExit('P205: sw.js não está na versão P204 esperada')
          w = w.replace('service worker P204', 'service worker P205')
          w = w.replace("carbonautas-p204-20260921", "carbonautas-p205-20260921")
          sw.write_text(w, encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert "window.CARBONAUTAS_BUILD='P205-20260921';" in s
          assert "const localThread={id:ref.id,groupName" in s
          assert "$('#p48Shell')?.classList.add('chat-open')" in s
          print('P205 checks OK')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "P205: estabilizar criação de panelinhas [p205-applied]"
          git push
