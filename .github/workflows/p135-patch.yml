      - name: Validacoes estaticas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'root guard corrigido': "&&painted)return;" in s,
            'motivos detalhados': 'p135HealthDetailsHTML' in s and 'details.push' in s,
            'toolbar Rede': 'p135RedeToolbar' in s,
