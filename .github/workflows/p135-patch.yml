</style>
<script id="p135-rede-acompanhamento-script">
(function(){
'use strict';
if(window.__CARBONAUTAS_P135_REDE)return;window.__CARBONAUTAS_P135_REDE=true;
let mode='all',baseBuildLinks=null;
const $135=(s,r=document)=>r.querySelector(s);
function norm135(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function relationKinds135(link){
  const txt=norm135((link.reasons||[]).map(r=>r.label||'').join(' ')),types=new Set((link.reasons||[]).map(r=>r.type));const kinds=new Set();
  if(/orient|orientador|orientand/.test(txt))kinds.add('orientation');
  if(types.has('linha')||/projeto|pesquisa|campo|laborat|coleta|experimento/.test(txt))kinds.add('projects');
  if(types.has('producao')||/artigo|publica|produc|resumo|manuscrito|capitulo|coautor|dados.+conjunto|escrev/.test(txt))kinds.add('production');
  return kinds;
}
function productionLinks135(members,links){
  const ids=new Set(members.map(m=>m.id)),seen=new Set(links.map(l=>[String(l.source?.id||l.source),String(l.target?.id||l.target)].sort().join('|'))),extra=[];
  try{(state.publicacoes||[]).forEach(p=>{const people=[p.memberId,...(Array.isArray(p.collaboratorMemberIds)?p.collaboratorMemberIds:[])].filter((v,i,a)=>v&&ids.has(v)&&a.indexOf(v)===i);for(let i=0;i<people.length;i++)for(let j=i+1;j<people.length;j++){const key=[people[i],people[j]].sort().join('|');if(seen.has(key))continue;seen.add(key);extra.push({source:people[i],target:people[j],reasons:[{type:'producao',label:`Produção compartilhada${p.title?' · '+p.title:''}`}],w:1,aux:true})}})}catch(_e){}
  return extra;
}
function insight135(members,links){
  const deg=new Map(members.map(m=>[m.id,0]));links.forEach(l=>{const a=String(l.source?.id||l.source),b=String(l.target?.id||l.target);if(deg.has(a))deg.set(a,deg.get(a)+1);if(deg.has(b))deg.set(b,deg.get(b)+1)});const isolated=[...deg.values()].filter(n=>n===0).length;const top=[...deg.entries()].sort((a,b)=>b[1]-a[1])[0];const tm=top?members.find(m=>m.id===top[0]):null;const el=$135('#p135RedeInsight');if(el)el.textContent=`${members.length} pessoas · ${isolated} isolada(s)${tm&&top[1]?` · mais conexões: ${tm.nome} (${top[1]})`:''}`;
}
function installBuildLinks135(){
  try{if(baseBuildLinks||typeof buildLinks!=='function')return;baseBuildLinks=buildLinks;buildLinks=function(members){let links=baseBuildLinks(members),prod=productionLinks135(members,links);if(mode==='all')links=links.concat(prod);else if(mode==='production')links=links.filter(l=>relationKinds135(l).has('production')).concat(prod);else links=links.filter(l=>relationKinds135(l).has(mode));insight135(members,links);return links}}catch(e){console.warn('P135 buildLinks',e)}
}
function redraw135(){try{const fn=window.renderGraph||renderGraph;const raw=fn?.__p97Original||fn;if(typeof raw==='function')raw();setTimeout(()=>{try{if(simulation){simulation.alphaTarget(0);simulation.stop()}}catch(_e){}},1200)}catch(e){console.warn('P135 redraw',e)}}
function setMode135(next){mode=next;window.CARBONAUTAS_REDE_MODE=mode;document.querySelectorAll('[data-p135-mode]').forEach(b=>b.classList.toggle('on',b.dataset.p135Mode===mode));redraw135()}
function boot135(){
  const view=$135('#viewRede'),main=view?.querySelector('.main'),graph=view?.querySelector('.graph-wrap');if(!view||!main||!graph)return;
  installBuildLinks135();
  if(!$135('#p135RedeToolbar')){const bar=document.createElement('div');bar.id='p135RedeToolbar';bar.className='p135-rede-toolbar';bar.innerHTML='<div class="p135-rede-heading"><b>Rede</b><small>Pessoas e relações</small></div><button type="button" class="p135-rede-settings-btn" id="p135RedeSettingsBtn">⚙ Ajustes</button><div class="p135-rede-modes"><button class="p135-rede-mode on" data-p135-mode="all">Todos</button><button class="p135-rede-mode" data-p135-mode="orientation">Orientação</button><button class="p135-rede-mode" data-p135-mode="projects">Projetos</button><button class="p135-rede-mode" data-p135-mode="production">Produção</button></div><div class="p135-rede-insight" id="p135RedeInsight">Carregando rede…</div>';const search=$135('.topbar .search')||$135('.search');if(search)bar.insertBefore(search,bar.querySelector('.p135-rede-modes'));view.insertBefore(bar,main);bar.querySelectorAll('[data-p135-mode]').forEach(b=>b.onclick=()=>setMode135(b.dataset.p135Mode));}
  if(!$135('#p135RedeSettings')){const overlay=document.createElement('div');overlay.id='p135RedeSettings';overlay.hidden=true;overlay.innerHTML='<div class="p135-settings-sheet"><div class="p135-settings-head"><b>Ajustes da Rede</b><button type="button" class="p135-settings-close" aria-label="Fechar">×</button></div></div>';document.body.appendChild(overlay);const sheet=overlay.querySelector('.p135-settings-sheet'),side=view.querySelector('.side'),controls=view.querySelector('.graph-controls');if(side)sheet.appendChild(side);if(controls)sheet.appendChild(controls);const close=()=>overlay.hidden=true;$135('#p135RedeSettingsBtn').onclick=()=>overlay.hidden=false;overlay.querySelector('.p135-settings-close').onclick=close;overlay.onclick=e=>{if(e.target===overlay)close()};}
  const stats=view.querySelector('.stats');if(stats){const sync=()=>{const n=stats.querySelector('.stat .n')?.textContent;if(n&&!$135('#p135RedeInsight')?.textContent.includes('pessoas'))$135('#p135RedeInsight').textContent=`${n} pessoas`};new MutationObserver(sync).observe(stats,{childList:true,subtree:true});sync()}
  setTimeout(redraw135,100);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot135,{once:true});else boot135();
})();
</script>
'''
              s=s.replace('</body>',layer+'\n</body>')

