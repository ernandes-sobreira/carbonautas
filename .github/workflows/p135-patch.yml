          }
          bad=[k for k,v in checks.items() if not v]
          for k,v in checks.items(): print(('OK ' if v else 'FALHA ')+k)
          if bad: raise SystemExit('Falharam: '+', '.join(bad))
          # garante que a condicao antiga que causava a regressao nao restou
          if "if(sig===lastGraphSig&&$('#graph .zoomG'))return;" in s: raise SystemExit('guarda antiga ainda presente')
          PY
          git diff --check

      - name: Commit da correção no ramo de trabalho
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Nenhuma alteração para commitar.'
            exit 0
          fi
          git config user.name 'carbonautas-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'P135: corrigir Rede e tornar alertas explicitos [p135-applied]'
          git push origin HEAD:fix/rede-acompanhamento-mobile
