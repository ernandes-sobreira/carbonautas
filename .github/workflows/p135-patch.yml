.p135-snapshot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.p135-snapshot>div{border:1px solid #dde9e7;background:#fff;border-radius:14px;padding:9px;min-width:0}.p135-snapshot span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;color:#809198;font-weight:900}.p135-snapshot b{display:block;font-size:11.5px;color:#24424d;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p135-snapshot small{display:block;font-size:9.5px;color:#778b92;margin-top:3px;line-height:1.3}
