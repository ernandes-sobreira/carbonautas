name: P135 aplicar correção Rede e Acompanhamento

on:
  push:
    branches:
      - fix/rede-acompanhamento-mobile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[p135-applied]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rede-acompanhamento-mobile
          fetch-depth: 0

      - name: Corrigir validação local do aplicador
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/p135_patch.py')
          s=p.read_text(encoding='utf-8')
          old="'ajustes rede': 'id=\"p135RedeSettings\"' in s,"
          new="'ajustes rede': \"modal.id='p135RedeSettings'\" in s,"
          if old not in s:
              raise SystemExit('Validação antiga não encontrada')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Aplicar correção auditada
        run: python3 .github/p135_patch.py

      - name: Validar diff
        run: |
          git diff --check
          grep -Fq "const painted=!!\$('#graph g.node')" index.html
          grep -Fq 'p135-rede-acompanhamento-fix' index.html
          grep -Fq 'p135HealthDetails' index.html
          grep -Fq "modal.id='p135RedeSettings'" index.html

      - name: Commit no branch de correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git commit -m "P135: corrigir Rede e explicitar alertas [p135-applied]"
          git push origin HEAD:fix/rede-acompanhamento-mobile
