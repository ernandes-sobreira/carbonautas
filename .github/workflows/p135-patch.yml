name: P135 patch Rede e Acompanhamento
on:
  push:
    branches:
      - fix/rede-acompanhamento-mobile
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[p135-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rede-acompanhamento-mobile
          fetch-depth: 0
      - name: Corrigir causa e simplificar interface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          original=s

          # 1) CAUSA-RAIZ: P97 confundia o grupo SVG vazio criado pelo carregamento
          #    tardio do D3 (P129) com um grafo ja renderizado.
          old="if(sig===lastGraphSig&&$('#graph .zoomG'))return;"
          new="const painted=!!$('#graph g.node')||$('#emptyGraph')?.style.display==='grid';if(sig===lastGraphSig&&$('#graph .zoomG')&&painted)return;"
          if old not in s:
              raise SystemExit('ERRO: guarda P97 esperada nao encontrada')
          s=s.replace(old,new)

          # 2) ACOMPANHAMENTO: manter a classificacao existente, mas transportar
          #    os registros concretos que explicam o status (titulo/data/id).
          old_health="""function memberHealth(m){
  const acts=state.activities.filter(a=>a.ownerId===m.id), now=Date.now();let points=0,reasons=[];
  const overdue=acts.filter(_isOverdue);if(overdue.length){points+=4;reasons.push(`${overdue.length} item(ns) atrasado(s)`)}
  const corrections=acts.filter(a=>a.type==='correcao'&&!_activityDone(a));if(corrections.length){points+=Math.min(3,corrections.length);reasons.push(`${corrections.length} correção(ões) pendente(s)`)}
  const next=acts.filter(a=>!_activityDone(a)&&a.dueDate).map(a=>({a,di:dateInfo(a.dueDate)})).filter(x=>x.di&&x.di.diff>=0&&x.di.diff<=14);if(next.length){points+=2;reasons.push(`${next.length} prazo(s) em até 14 dias`)}
  if(m.bolsista&&m.bolsaFim){const pi=trackPeriodInfo(m.bolsaInicio,m.bolsaFim);if(pi.days!==null&&pi.days>=0&&pi.days<=45){points+=2;reasons.push('bolsa encerrando em breve')}}
  const lm=lastActivityMillis(m.id);if(m.status!=='egresso'&&lm&&now-lm>45*86400000){points+=1;reasons.push('sem atualização há mais de 45 dias')}
  if(m.status!=='egresso'&&!(m.perguntaCientifica||'').trim()){points+=1;reasons.push('pergunta científica não preenchida')}
  const level=points>=4?'red':points>=2?'yellow':'green';return {level,points,reasons:reasons.length?reasons:['em dia']};
}"""
          new_health="""function memberHealth(m){
  const acts=state.activities.filter(a=>a.ownerId===m.id), now=Date.now();let points=0,reasons=[],details=[];const seen=new Set();
  const titleOf=a=>String(a?.title||(typeof ACTIVITY_TYPES!=='undefined'&&ACTIVITY_TYPES[a?.type])||'Acompanhamento').trim()||'Acompanhamento';
  const pushDetail=(a,kind,when)=>{const key=a?.id||`${a?.type||''}|${a?.title||''}|${a?.dueDate||''}`;if(seen.has(key))return;seen.add(key);const title=titleOf(a);details.push({kind,activityId:a?.id||'',title,dueDate:a?.dueDate||'',when,text:`${title} — ${when}`})};
  const overdue=acts.filter(_isOverdue);if(overdue.length){points+=4;reasons.push(`${overdue.length} item(ns) atrasado(s)`);[...overdue].sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||''))).slice(0,4).forEach(a=>{const di=a.dueDate?dateInfo(a.dueDate):null,n=Math.abs(di?.diff||0);pushDetail(a,'overdue',n===1?'atrasado há 1 dia':n>1?`atrasado há ${n} dias`:'atrasado')})}
  const corrections=acts.filter(a=>a.type==='correcao'&&!_activityDone(a));if(corrections.length){points+=Math.min(3,corrections.length);reasons.push(`${corrections.length} correção(ões) pendente(s)`);corrections.slice(0,4).forEach(a=>pushDetail(a,'correction','correção pendente'))}
  const next=acts.filter(a=>!_activityDone(a)&&a.dueDate).map(a=>({a,di:dateInfo(a.dueDate)})).filter(x=>x.di&&x.di.diff>=0&&x.di.diff<=14);if(next.length){points+=2;reasons.push(`${next.length} prazo(s) em até 14 dias`);next.sort((a,b)=>a.di.diff-b.di.diff).slice(0,5).forEach(({a,di})=>pushDetail(a,'soon',di.diff===0?'vence hoje':di.diff===1?'vence amanhã':`vence em ${di.diff} dias`))}
  if(m.bolsista&&m.bolsaFim){const pi=trackPeriodInfo(m.bolsaInicio,m.bolsaFim);if(pi.days!==null&&pi.days>=0&&pi.days<=45){points+=2;reasons.push('bolsa encerrando em breve');details.push({kind:'scholarship',activityId:'',title:m.bolsaModalidade||'Bolsa',dueDate:m.bolsaFim,when:pi.days===0?'encerra hoje':pi.days===1?'encerra amanhã':`encerra em ${pi.days} dias`,text:`${m.bolsaModalidade||'Bolsa'} — ${pi.days===0?'encerra hoje':pi.days===1?'encerra amanhã':`encerra em ${pi.days} dias`}`})}}
  const lm=lastActivityMillis(m.id);if(m.status!=='egresso'&&lm&&now-lm>45*86400000){const days=Math.floor((now-lm)/86400000);points+=1;reasons.push('sem atualização há mais de 45 dias');details.push({kind:'stale',activityId:'',title:'Sem atualização recente',dueDate:'',when:`última atualização há ${days} dias`,text:`Sem atualização recente — última atualização há ${days} dias`})}
  if(m.status!=='egresso'&&!(m.perguntaCientifica||'').trim()){points+=1;reasons.push('pergunta científica não preenchida');details.push({kind:'profile',activityId:'',title:'Pergunta científica',dueDate:'',when:'não preenchida',text:'Pergunta científica — não preenchida'})}
  const level=points>=4?'red':points>=2?'yellow':'green';return {level,points,reasons:reasons.length?reasons:['em dia'],details};
}"""
          if old_health not in s:
              raise SystemExit('ERRO: memberHealth base esperado nao encontrado')
          s=s.replace(old_health,new_health)

          # 3) P97: mostrar motivos concretos e um resumo acionavel logo na primeira tela.
          marker="function overviewCard(m,can){"
          if marker not in s:
              raise SystemExit('ERRO: overviewCard P97 nao encontrado')
          helpers="""function p135HealthDetailsHTML(h){
  const ds=(h?.details||[]).slice(0,5);if(!ds.length)return `<div>${esc97((h?.reasons||[]).slice(0,4).join(' · '))}</div>`;
  return `<div class=\"p135-health-reasons\">${ds.map(d=>`<div class=\"p135-health-reason ${esc97(d.kind||'')}\"><b>${esc97(d.title||'Motivo')}</b><span>${d.dueDate?esc97(fmtDate(d.dueDate))+' · ':''}${esc97(d.when||d.text||'')}</span></div>`).join('')}</div>`;
}
function p135SnapshotHTML(m){
  const acts=actsFor(m.id),open=acts.filter(a=>!activityDone(a));
  const due=open.filter(a=>a.dueDate).map(a=>({a,d:dueDiff(a)})).filter(x=>x.d!==null&&x.d>=0).sort((a,b)=>a.d-b.d)[0];
  const late=open.filter(overdue).sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')))[0];
  const last=[...acts].sort((a,b)=>(millis(b.updatedAt)||millis(b.createdAt))-(millis(a.updatedAt)||millis(a.createdAt)))[0];
  const action=late||due?.a||open.find(a=>a.type==='correcao')||open.find(a=>a.type==='pendencia')||open[0];
  const lastMs=last?(millis(last.updatedAt)||millis(last.createdAt)):0,lastDate=lastMs?new Date(lastMs).toLocaleDateString('pt-BR'):'';
  const dueTxt=due?(due.d===0?'hoje':due.d===1?'amanhã':`em ${due.d} dias`):'—';
  return `<div class=\"p135-snapshot\"><div><span>Próximo prazo</span><b>${due?esc97(due.a.title||typeLabel(due.a)):'—'}</b><small>${due?esc97(fmtDate(due.a.dueDate))+' · '+dueTxt:'Nenhum prazo futuro aberto'}</small></div><div><span>Última atividade</span><b>${last?esc97(last.title||typeLabel(last)):'—'}</b><small>${lastDate||'Sem registro'}</small></div><div><span>Próxima ação</span><b>${action?esc97(action.title||typeLabel(action)):'Tudo em dia'}</b><small>${late?'Está atrasado':due?`Prazo ${dueTxt}`:action?'Item ainda aberto':'Nenhuma ação imediata'}</small></div></div>`;
}
"""
          s=s.replace(marker,helpers+marker)
          old_why='<div class="p97-info full"><label>Por que está assim?</label><div>${esc97((h.reasons||[]).slice(0,4).join(\' · \'))}</div></div>'
          new_why='<div class="p97-info full"><label>Por que está assim?</label>${p135HealthDetailsHTML(h)}</div>${p135SnapshotHTML(m)}'
          if old_why not in s:
              raise SystemExit('ERRO: bloco Por que esta assim P97 nao encontrado')
          s=s.replace(old_why,new_why)
          old_folder='<div class="p97-folder-meta"><span class="p97-mini">${c.open} abertos</span><span class="p97-mini">${c.late} atrasados</span><span class="p97-mini">${c.corr} correções</span><span class="p97-open">abrir cartas →</span></div>'
          new_folder='<div class="p97-folder-meta"><span class="p135-folder-reason">${esc97(h.details?.[0]?.text||h.reasons?.[0]||\'Em dia\')}</span><span class="p97-open">abrir →</span></div>'
          if old_folder not in s:
              raise SystemExit('ERRO: metadados de pasta P97 nao encontrados')
          s=s.replace(old_folder,new_folder)
          s=s.replace('Escolha um siminino ou uma siminina. A pasta abre como um baralho de acompanhamento.','Escolha uma pessoa para ver situação, prazos e próxima ação.')
          s=s.replace("function healthLabel(h){return h.level==='red'?'Intervir':h.level==='yellow'?'Atenção':'Em dia'}","function healthLabel(h){return h.level==='red'?'Urgente':h.level==='yellow'?'Atenção':'Em dia'}")

          # 4) Camada de interface P135: nenhum dado novo no Firebase; apenas reorganiza
          #    os controles que ja existem e acrescenta modos de leitura da rede.
          if 'id="p135-rede-acompanhamento-fix"' not in s:
              layer=r'''
<style id="p135-rede-acompanhamento-fix">
