name: P208 correcao final panelinhas
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p208-final]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correcao definitiva
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_mount="function mount(){const v=$('#viewMensagens');if(!v)return false;let created=false;if(!$('#p48GroupsRoot')){v.innerHTML=shellHTML();bindUI();created=true}markTabs();if(created){renderList();renderHead();renderMessages()}return true}"
          new_mount="function mount(){const v=$('#viewMensagens');if(!v)return false;let root=v.querySelector('#p48GroupsRoot');if(!root){v.innerHTML=shellHTML();root=v.querySelector('#p48GroupsRoot')}if(!root)return false;bindUI();markTabs();renderList();renderHead();renderMessages();return true}"
          if s.count(old_mount)!=1: raise SystemExit(f'mount esperado 1, encontrado {s.count(old_mount)}')
          s=s.replace(old_mount,new_mount)

          old_open="function openPanelinhas(){active=true;document.body.setAttribute('data-p48-groups','1');document.body.classList.add('p98-panel-active');if(typeof window.switchView==='function'&&document.body.dataset.view!=='mensagens')window.switchView('mensagens');setTimeout(()=>{mount();renderList();if(!activeThreadId&&threads.length)activeThreadId=threads[0].id;renderHead();renderList();if(activeThreadId)subscribeMessages(activeThreadId)},40)}"
          new_open="function activatePanelView(){document.body.dataset.view='mensagens';document.querySelectorAll('.view').forEach(el=>el.classList.remove('on'));document.querySelector('#viewMensagens')?.classList.add('on');document.querySelectorAll('.tab').forEach(el=>el.classList.toggle('on',(el.dataset.group||el.dataset.view)==='conversas'));const nav=document.querySelector('#subNav');nav?.querySelector('[data-sub-view=\"mensagens\"]')?.classList.remove('on');nav?.querySelector('[data-sub-view=\"conversas\"]')?.classList.remove('on');nav?.querySelector('.p46-panel-btn')?.classList.add('on')}function openPanelinhas(){active=true;document.body.setAttribute('data-p48-groups','1');document.body.classList.add('p98-panel-active');activatePanelView();mount();if(!activeThreadId&&threads.length)activeThreadId=threads[0].id;renderList();renderHead();renderMessages();if(activeThreadId)subscribeMessages(activeThreadId);setTimeout(()=>{activatePanelView();mount();if(activeThreadId)subscribeMessages(activeThreadId)},80)}"
          if s.count(old_open)!=1: raise SystemExit(f'openPanelinhas esperado 1, encontrado {s.count(old_open)}')
          s=s.replace(old_open,new_open)

          old_handler="document.addEventListener('click',e=>{const pan=e.target.closest?.('.p46-panel-btn');if(pan){e.preventDefault();e.stopImmediatePropagation();openPanelinhas();return}const oldNew=e.target.closest?.('#p46NewGroup');if(oldNew){e.preventDefault();e.stopImmediatePropagation();openPanelinhas();setTimeout(openModal,50);return}const general=e.target.closest?.('#subNav [data-sub-view=\"mensagens\"],#subNav [data-sub-view=\"conversas\"]');if(general&&!general.classList.contains('p46-panel-btn'))leave()},true);"
          new_handler="document.addEventListener('click',e=>{const th=e.target.closest?.('#p48GroupsRoot .p48-thread[data-g]');if(th){e.preventDefault();e.stopImmediatePropagation();selectThread(th.dataset.g);return}const pan=e.target.closest?.('.p46-panel-btn');if(pan){e.preventDefault();e.stopImmediatePropagation();openPanelinhas();return}const oldNew=e.target.closest?.('#p46NewGroup');if(oldNew){e.preventDefault();e.stopImmediatePropagation();openPanelinhas();setTimeout(openModal,50);return}const general=e.target.closest?.('#subNav [data-sub-view=\"mensagens\"],#subNav [data-sub-view=\"conversas\"]');if(general&&!general.classList.contains('p46-panel-btn'))leave()},true);"
          if s.count(old_handler)!=1: raise SystemExit(f'handler esperado 1, encontrado {s.count(old_handler)}')
          s=s.replace(old_handler,new_handler)

          old_panelmounted="function isPanelinhaMounted(){\n  const root=document.querySelector('#viewMensagens #p48GroupsRoot');\n  if(!root)return false;\n  /* Só vale como panelinha ativa quando a própria view de mensagens está ativa. */\n  return document.body.dataset.view==='mensagens';\n}"
          new_panelmounted="function isPanelinhaMounted(){\n  const root=document.querySelector('#viewMensagens #p48GroupsRoot');\n  return !!root && document.body.dataset.view==='mensagens' && document.body.hasAttribute('data-p48-groups');\n}"
          if s.count(old_panelmounted)!=1: raise SystemExit(f'isPanelinhaMounted esperado 1, encontrado {s.count(old_panelmounted)}')
          s=s.replace(old_panelmounted,new_panelmounted)

          old_p98="function boot(){\n  injectCss();watchMensagens();bindTabGuard();keepState();\n  setInterval(()=>{keepState();grow('#privateInput');grow('#p46Input');grow('#p48Input')},450);\n  console.info('Carbonautas',VERSION,'abas sincronizadas com a tela real + campos de conversa ampliados');\n}"
          new_p98="function boot(){\n  injectCss();\n  panelActive=false;document.body.classList.remove('p98-panel-active');document.querySelectorAll('[data-p98-general-sentinel]').forEach(n=>n.remove());\n  setInterval(()=>{grow('#privateInput');grow('#p46Input');grow('#p48Input')},650);\n  console.info('Carbonautas',VERSION,'P208: controlador concorrente de panelinhas desativado');\n}"
          if s.count(old_p98)!=1: raise SystemExit(f'boot P98 esperado 1, encontrado {s.count(old_p98)}')
          s=s.replace(old_p98,new_p98)

          css_anchor="#p48GroupsRoot{min-height:0!important;height:100%!important}"
          css_new="#p48GroupsRoot{min-height:0!important;height:100%!important;position:relative!important;z-index:20!important;pointer-events:auto!important}.p48-list,.p48-thread{pointer-events:auto!important}"
          if s.count(css_anchor)!=1: raise SystemExit(f'css anchor esperado 1, encontrado {s.count(css_anchor)}')
          s=s.replace(css_anchor,css_new)

          if s.count("window.CARBONAUTAS_BUILD='P207-20260921';")!=1: raise SystemExit('build P207 nao encontrado')
          s=s.replace("window.CARBONAUTAS_BUILD='P207-20260921';","window.CARBONAUTAS_BUILD='P208-20260921';")
          if s.count("./sw.js?v=P207-20260921")!=1: raise SystemExit('registro SW P207 nao encontrado')
          s=s.replace("./sw.js?v=P207-20260921","./sw.js?v=P208-20260921")
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          if 'service worker P207' not in w or 'carbonautas-p207-20260921' not in w: raise SystemExit('sw P207 esperado nao encontrado')
          w=w.replace('service worker P207','service worker P208').replace('carbonautas-p207-20260921','carbonautas-p208-20260921')
          sw.write_text(w,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            "function activatePanelView()",
            "#p48GroupsRoot .p48-thread[data-g]",
            "document.body.hasAttribute('data-p48-groups')",
            "controlador concorrente de panelinhas desativado",
            "window.CARBONAUTAS_BUILD='P208-20260921';"
          ]
          for c in checks: assert c in s, c
          assert "watchMensagens();bindTabGuard();keepState();" not in s
          w=Path('sw.js').read_text(encoding='utf-8')
          assert 'service worker P208' in w and 'carbonautas-p208-20260921' in w
          print('P208 FINAL CHECKS OK')
          PY

          rm -f .p208-panelinhas-report.txt
          rm -f .github/workflows/p208-panelinhas-deep-diagnostic.yml
          rm -f .github/workflows/p208-panelinhas-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P208: panelinhas com navegacao e selecao diretas [p208-final]"
          git push