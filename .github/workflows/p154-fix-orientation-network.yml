name: P154 fix orientation network
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/p154_patch.py
      - name: Validate
        run: |
          node --check p135-rede-acompanhamento.js
          node --check modules/rede-orientacao-p150.js
          node --check modules/dossier-p132.js
          python - <<'PY'
          from pathlib import Path
          p135=Path('p135-rede-acompanhamento.js').read_text()
          p150=Path('modules/rede-orientacao-p150.js').read_text()
          loader=Path('modules/dossier-p132.js').read_text()
          idx=Path('index.html').read_text()
          assert 'function orientationLinks(members)' in p135
          assert "else if(relationMode==='orientation')links=orient" in p135
          assert "if(labels&&!labels.checked)labels.checked=true" in p135
          assert 'orient?.remove()' not in p150
          assert 'st.activities.unshift' in p150
          assert 'rede-orientacao-linhas-p152.js' not in loader
          assert 'dossier-p132.js?v=P154-20260919' in idx
          print('P154 OK')
          PY
      - name: Commit
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html p135-rede-acompanhamento.js modules/rede-orientacao-p150.js modules/dossier-p132.js
          git commit -m "P154: corrigir orientação real e nomes da Rede"
          git push
