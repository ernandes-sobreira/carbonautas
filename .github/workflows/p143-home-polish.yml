name: P143 home polish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS-only P143 polish
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          scripts_before=re.findall(r'<script\b[^>]*>.*?</script>', s, flags=re.S|re.I)
          m=re.search(r'<style id="p142HomeCommandCenterStyle">.*?</style>', s, flags=re.S)
          if not m: raise SystemExit('P142 style block not found')
          css='''<style id="p142HomeCommandCenterStyle">
#viewPainel .p142-home-grid{display:block!important;max-width:860px;margin:0 auto;width:100%}
#viewPainel .p142-command-card{padding:0!important;border:0!important;box-shadow:none!important;background:transparent!important;border-radius:0!important}
#viewPainel .p142-command-intro{display:flex;align-items:end;justify-content:space-between;padding:4px 2px 10px}
#viewPainel .p142-command-intro h3{margin:2px 0 0;font-size:18px;letter-spacing:-.025em;color:#173b4b}
#viewPainel .p142-command-intro .dash-sub{font-size:11.5px;color:#82949b;margin-top:2px}
#viewPainel .p142-eyebrow{font-size:9px;font-weight:900;letter-spacing:.14em;color:#188c8f}
#viewPainel .p142-accordion{margin:8px 0!important;border:1px solid #dce9e7!important;background:rgba(255,255,255,.98)!important;border-radius:19px!important;overflow:hidden!important;box-shadow:0 8px 24px rgba(25,69,78,.045)!important;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
#viewPainel .p142-accordion:first-of-type{margin-top:0!important}
#viewPainel .p142-accordion summary{list-style:none!important;display:flex!important;align-items:center!important;gap:12px!important;min-height:72px!important;padding:11px 13px!important;cursor:pointer!important;user-select:none!important}
#viewPainel .p142-accordion summary::-webkit-details-marker{display:none!important}
#viewPainel .p142-accordion summary::marker{content:''}
#viewPainel .p142-icon{width:44px!important;height:44px!important;display:grid!important;place-items:center!important;flex:0 0 44px!important;border-radius:14px!important;font-size:21px!important;line-height:1!important;background:#edf7f5!important;border:1px solid #d8ebe7!important}
#viewPainel .p142-accordion:nth-of-type(1) .p142-icon{background:#fff8e9!important;border-color:#f4dfae!important}
#viewPainel .p142-accordion:nth-of-type(2) .p142-icon{background:#eaf8f1!important;border-color:#cfe9dc!important}
#viewPainel .p142-accordion:nth-of-type(3) .p142-icon{background:#f2edfb!important;border-color:#e0d7f2!important}
#viewPainel .p142-accordion:nth-of-type(4) .p142-icon{background:#eef6fb!important;border-color:#d9e8f2!important}
#viewPainel .p142-label{display:flex!important;flex-direction:column!important;gap:3px!important;min-width:0!important;flex:1!important}
#viewPainel .p142-label b{font-family:'Space Grotesk','Inter',sans-serif!important;font-size:15.5px!important;line-height:1.18!important;color:#173b4b!important;letter-spacing:-.018em!important}
#viewPainel .p142-label small{font-size:11.5px!important;line-height:1.3!important;color:#80929a!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#viewPainel .p142-toggle{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:58px!important;border:1px solid #d7e7e4!important;background:#f8fbfa!important;border-radius:999px!important;padding:7px 11px!important;font-size:11px!important;font-weight:850!important;color:#315665!important;flex:0 0 auto!important}
#viewPainel .p142-hide{display:none!important}
#viewPainel .p142-accordion[open] .p142-show{display:none!important}
#viewPainel .p142-accordion[open] .p142-hide{display:inline!important}
#viewPainel .p142-accordion[open]{border-color:#bddbd5!important;box-shadow:0 12px 30px rgba(25,69,78,.07)!important;background:#fbfefd!important}
#viewPainel .p142-accordion[open] .p142-toggle{background:#e8f5f2!important;border-color:#c5e2dc!important;color:#0e7479!important}
#viewPainel .p142-body{padding:0 13px 14px!important;border-top:1px solid #edf3f2!important}
#viewPainel .p142-body-actions{display:flex!important;justify-content:flex-end!important;margin:10px 0!important}
#viewPainel .p142-note{margin:10px 0!important;font-size:11.5px!important;color:#748991!important}
#viewPainel .p142-body .attention-list,#viewPainel .p142-body #dashHealth,#viewPainel .p142-body #dashProducts,#viewPainel .p142-body #dashCheckin{margin-top:10px!important}
@media(min-width:921px){
 #viewPainel .p142-home-grid{max-width:980px!important}
 #viewPainel .p142-command-intro{padding:2px 4px 12px!important}
}
@media(max-width:700px){
 #viewPainel .p142-home-grid{max-width:none!important}
 #viewPainel .p142-command-intro{padding:2px 2px 8px!important}
 #viewPainel .p142-command-intro h3{font-size:17px!important}
 #viewPainel .p142-command-intro .dash-sub{display:none!important}
 #viewPainel .p142-accordion{margin:7px 0!important;border-radius:18px!important}
 #viewPainel .p142-accordion summary{min-height:68px!important;padding:10px 11px!important;gap:10px!important}
 #viewPainel .p142-icon{width:42px!important;height:42px!important;flex-basis:42px!important;border-radius:13px!important;font-size:20px!important}
 #viewPainel .p142-label b{font-size:15px!important}
 #viewPainel .p142-label small{font-size:11px!important;max-width:255px!important}
 #viewPainel .p142-toggle{min-width:52px!important;padding:6px 9px!important;font-size:10.5px!important}
 #viewPainel .p142-body{padding:0 10px 12px!important}
}
</style>'''
          s=s[:m.start()]+css+s[m.end():]
          scripts_after=re.findall(r'<script\b[^>]*>.*?</script>', s, flags=re.S|re.I)
          if scripts_before!=scripts_after: raise SystemExit('scripts changed unexpectedly')
          if '#viewDashboard' in css: raise SystemExit('wrong selector remains')
          for rid in ['dashNewTaskBtn','dashAttention','dashHealth','dashProductsAllBtn','dashProducts','dashCheckin']:
            if s.count(f'id="{rid}"')!=1: raise SystemExit(f'{rid} count invalid')
          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q '#viewPainel .p142-accordion summary' index.html
          ! grep -q '#viewDashboard .p142-accordion' index.html
      - name: Commit
        run: |
          git config user.name 'ernandes-sobreira'
          git config user.email '156730719+ernandes-sobreira@users.noreply.github.com'
          git add index.html
          git commit -m 'P143: sofisticar capa expansível sem alterar JavaScript'
          git push
