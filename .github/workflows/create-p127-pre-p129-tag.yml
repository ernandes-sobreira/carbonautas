name: Create P127 pre-P129 restore tag

on:
  push:
    branches:
      - P127-pre-P129-safety

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main at expected P127 commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify main and create annotated restore tag
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="68b70a05d7d99ee8819a3c148b7ac731d45120f9"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED" || { echo "main changed: $ACTUAL"; exit 1; }
          if git ls-remote --exit-code --tags origin refs/tags/P127-pre-P129 >/dev/null 2>&1; then
            echo "Tag P127-pre-P129 already exists; refusing to overwrite."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a P127-pre-P129 "$EXPECTED" -m "Ponto de restauracao antes da P129"
          git push origin refs/tags/P127-pre-P129
