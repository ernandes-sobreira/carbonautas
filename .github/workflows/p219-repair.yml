name: P219 final repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "${{ !contains(github.event.head_commit.message, '[p219-repair]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Corrigir reabertura e renovar URL do módulo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/repository-ui-p219.js')
          s=p.read_text(encoding='utf-8')
          old="deck.hidden=true;deck.style.setProperty('display','none','important');"
          new="deck.hidden=true;deck.style.removeProperty('display');"
          if old in s:
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          i=Path('index.html')
          h=i.read_text(encoding='utf-8')
          h=h.replace('repository-ui-p219.js?v=P219-20260922','repository-ui-p219.js?v=P2191-20260922')
          i.write_text(h,encoding='utf-8')
          PY
          node --check modules/repository-ui-p219.js
      - name: Publicar e remover workflow temporário
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p219-repair.yml
          git add index.html modules/repository-ui-p219.js
          git commit -m "P219: ajuste final de camada e cache [p219-repair]"
          git push
