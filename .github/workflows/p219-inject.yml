name: P219 repository deck fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate-and-inject:
    if: "${{ !contains(github.event.head_commit.message, '[p219-injected]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar modulo P219
        run: node --check modules/repository-ui-p219.js
      - name: Inserir carregador P219 no body real
        shell: bash
        run: |
          set -euo pipefail
          cp index.html /tmp/index.before-p219.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./modules/repository-ui-p219.js?v=P219-20260922"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('index sem </body> real')
              s=s[:pos]+tag+'\n'+s[pos:]
          if s.count(tag)!=1:
              raise SystemExit('tag P219 duplicada')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar P219
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P219: ativar correcoes do Arquivo Vivo [p219-injected]"
          git push
