name: P146 inspect repository logic
on:
  push:
    branches: [fix/p146-repository-categories]
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repository logic
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['function refreshPubFilters','function renderPubs','pubCategoriaSel','CATEGORIAS[','CATEGORIAS.','categoria||','categoria ===','pubCategoria']
          out=[]
          for term in terms:
              out.append(f'### {term} count={s.count(term)}')
              start=0
              for n in range(min(s.count(term),20)):
                  i=s.find(term,start)
                  if i<0: break
                  a=max(0,i-1200); b=min(len(s),i+3500)
                  out.append(s[a:b].replace('\n','\\n'))
                  out.append('---')
                  start=i+len(term)
          Path('p146-inspect2.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add p146-inspect2.txt
          git commit -m "chore: inspect repository category logic" || exit 0
          git push
