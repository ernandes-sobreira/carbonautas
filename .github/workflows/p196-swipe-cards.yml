name: P196 swipe fisico nos cards
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p196-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P196 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,re,subprocess,sys
          idx=Path('index.html');s=idx.read_text(encoding='utf-8')
          required=['p195MinimalHomeController',"window.CARBONAUTAS_BUILD='P195-20260920';","navigator.serviceWorker.register('./sw.js?v=P195-20260920',{updateViaCache:'none'})","<button class=\"p195-btn\" data-n>Passar →</button>","q('[data-n]',card).onclick=()=>{pos=(pos+1)%a.length;render()}"]
          for a in required: assert a in s,f'anchor missing: {a[:100]}'
          assert 'p196SwipeCardsStyle' not in s
          css_anchor="#p195Deck .p195-k{font-size:10px;font-weight:950;letter-spacing:.12em;color:#148087}"
          css=base64.b64decode('').decode()
          assert css_anchor in s;s=s.replace(css_anchor,css+'\n'+css_anchor,1)
          render_anchor="function render(){const d=ensure();"
          swipe=base64.b64decode('').decode()
          assert render_anchor in s;s=s.replace(render_anchor,swipe+'\n'+render_anchor,1)
          old="if(!a.length){card.innerHTML='<div class=\"p195-empty\"><b>✓ Tudo certo.</b><span>Nada pedindo sua atenção agora.</span></div>';return}"
          new="if(!a.length){resetSwipe(card);card.innerHTML='<div class=\"p195-empty\"><b>✓ Tudo certo.</b><span>Nada pedindo sua atenção agora.</span></div>';return}"
          assert old in s;s=s.replace(old,new,1)
          old="q('[data-g]',card).onclick=()=>{const g=gone();g.add(it.key);save(g);render()}}"
          new="q('[data-g]',card).onclick=()=>{const g=gone();g.add(it.key);save(g);render()};bindSwipe(card,a,it)}"
          assert old in s;s=s.replace(old,new,1)
          s=s.replace("window.CARBONAUTAS_BUILD='P195-20260920';","window.CARBONAUTAS_BUILD='P196-20260920';",1)
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=P195-20260920',{updateViaCache:'none'})","navigator.serviceWorker.register('./sw.js?v=P196-20260920',{updateViaCache:'none'})",1)
          idx.write_text(s,encoding='utf-8')
          sw=Path('sw.js');w=sw.read_text(encoding='utf-8');assert 'service worker P195' in w and 'carbonautas-p195-20260920' in w;w=w.replace('service worker P195','service worker P196',1).replace('carbonautas-p195-20260920','carbonautas-p196-20260920',1);sw.write_text(w,encoding='utf-8')
          rm=Path('README.md');r=rm.read_text(encoding='utf-8');assert 'Todas as camadas P44 a P195 estao dentro dele' in r and '### P195 · 2026-09-20 · Capa mínima em passa-card' in r;r=r.replace('Todas as camadas P44 a P195 estao dentro dele','Todas as camadas P44 a P196 estao dentro dele',1);note='### P196 · 2026-09-20 · Swipe físico nos passa-cards\n- Cards acompanham o dedo ou mouse durante o arraste horizontal.\n- Swipe para a esquerda avança; swipe para a direita volta ao card anterior.\n- Soltar antes do limite devolve o card com efeito de mola.\n- Swipe concluído lança o card para fora da tela e traz o seguinte com animação.\n- Botões Passar, Abrir e Dispensar continuam disponíveis como alternativa.\n- Não alterado: dados, regras, Firebase, VPS ou permissões.\n\n';r=r.replace('### P195 · 2026-09-20 · Capa mínima em passa-card',note+'### P195 · 2026-09-20 · Capa mínima em passa-card',1);rm.write_text(r,encoding='utf-8')
          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p196-{i}.mjs');p.write_text(b,encoding='utf-8');z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode: print('JS block',i,'failed');print(z.stderr);sys.exit(1)
          print('validated',len(blocks),'script blocks; swipe anchors applied')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p196-swipe-cards.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P196: swipe fisico nos cards [p196-applied]"
          git push
