name: P210 restaurar login
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p210-done]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar base estável e esconder panelinhas sem JS invasivo
        shell: bash
        run: |
          set -euo pipefail
          # Volta o app e o SW exatamente para a base P208, que estava entrando normalmente.
          git show fcde8996e5a52a0278ef5a13511f65343dba6416:index.html > index.html
          git show fcde8996e5a52a0278ef5a13511f65343dba6416:sw.js > sw.js

          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Nova versão/cache.
          s=s.replace("window.CARBONAUTAS_BUILD='P208-20260921';","window.CARBONAUTAS_BUILD='P210-20260921';")
          s=s.replace("./sw.js?v=P208-20260921","./sw.js?v=P210-20260921")

          # Apenas CSS. Sem MutationObserver, sem sobrescrever funções, sem tocar no login.
          css='''\n<style id="p210-panelinhas-off">\n/* P210: Panelinhas desativadas visualmente, sem interferir na autenticação. */\n#subNav .p46-panel-btn,\n#p46NewGroup,\n#p48New,\n#p48GroupsRoot,\n#p46GroupOverlay,\n#p48GroupOverlay{display:none!important;visibility:hidden!important;pointer-events:none!important}\n</style>\n'''
          if 'id="p210-panelinhas-off"' not in s:
              if '</head>' not in s: raise SystemExit('head não encontrado')
              s=s.replace('</head>',css+'</head>',1)

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace('service worker P208','service worker P210').replace('carbonautas-p208-20260921','carbonautas-p210-20260921')
          sw.write_text(w,encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          w=Path('sw.js').read_text(encoding='utf-8')
          assert 'p210-panelinhas-off' in s
          assert 'p209-panelinhas-off-js' not in s
          assert 'MutationObserver(()=>queueMicrotask(cleanPanelinhas))' not in s
          assert "window.CARBONAUTAS_BUILD='P210-20260921';" in s
          assert './sw.js?v=P210-20260921' in s
          assert 'service worker P210' in w
          print('P210 checks OK')
          PY

          rm -f .github/workflows/p210-restore-login.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P210: restaurar login; panelinhas apenas ocultas [p210-done]"
          git push