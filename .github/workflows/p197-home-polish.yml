name: P197 home polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p197-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P197 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,re,subprocess,sys

          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')

          required=[
            'p196SwipeCardsStyle',
            "window.CARBONAUTAS_BUILD='P196-20260920';",
            "navigator.serviceWorker.register('./sw.js?v=P196-20260920',{updateViaCache:'none'})",
            "if(Math.abs(dx)<7)return;if(Math.abs(dx)<=Math.abs(dy)*1.05)return;horizontal=true",
            "const threshold=Math.min(118,card.offsetWidth*.22),fast=Math.abs(vx)>.55;",
            '<span class="p195-count"></span><button class="p195-btn ghost" data-g>Dispensar</button><button class="p195-btn" data-n>Passar →</button><button class="p195-btn primary" data-o>Abrir</button>'
          ]
          for a in required:
            assert a in s, f'anchor missing: {a[:120]}'
          assert 'p197HomePolishStyle' not in s

          s=s.replace(
            "if(Math.abs(dx)<7)return;if(Math.abs(dx)<=Math.abs(dy)*1.05)return;horizontal=true",
            "if(Math.abs(dx)<4)return;if(Math.abs(dx)<=Math.abs(dy)*.85)return;horizontal=true;if(e.cancelable)e.preventDefault()",
            1
          )
          s=s.replace(
            "const threshold=Math.min(118,card.offsetWidth*.22),fast=Math.abs(vx)>.55;",
            "const threshold=Math.min(58,Math.max(32,card.offsetWidth*.11)),fast=Math.abs(vx)>.22;",
            1
          )

          old='<span class="p195-count"></span><button class="p195-btn ghost" data-g>Dispensar</button><button class="p195-btn" data-n>Passar →</button><button class="p195-btn primary" data-o>Abrir</button>'
          new='<span class="p195-count"></span><span class="p197-swipehint">deslize</span><button class="p195-btn ghost" data-g>Dispensar</button><button class="p195-btn" data-n>→</button><button class="p195-btn primary" data-o>Abrir</button>'
          s=s.replace(old,new,1)

          old="q('[data-n]',card).style.display=a.length>1?'':'none';q('[data-o]',card).onclick=()=>open(it);"
          new="q('[data-n]',card).style.display=a.length>1?'':'none';q('[data-n]',card).setAttribute('aria-label','Próximo card');q('[data-n]',card).title='Próximo';q('[data-o]',card).onclick=()=>open(it);"
          assert old in s
          s=s.replace(old,new,1)

          css=base64.b64decode('').decode()
          head,tail=s.rsplit('</body>',1)
          s=head+css+'\n</body>'+tail

          s=s.replace("window.CARBONAUTAS_BUILD='P196-20260920';","window.CARBONAUTAS_BUILD='P197-20260920';",1)
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=P196-20260920',{updateViaCache:'none'})","navigator.serviceWorker.register('./sw.js?v=P197-20260920',{updateViaCache:'none'})",1)
          idx.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          assert 'service worker P196' in w and 'carbonautas-p196-20260920' in w
          w=w.replace('service worker P196','service worker P197',1).replace('carbonautas-p196-20260920','carbonautas-p197-20260920',1)
          sw.write_text(w,encoding='utf-8')

          rm=Path('README.md')
          r=rm.read_text(encoding='utf-8')
          assert 'Todas as camadas P44 a P196 estao dentro dele' in r
          assert '### P196 · 2026-09-20 · Swipe físico nos passa-cards' in r
          r=r.replace('Todas as camadas P44 a P196 estao dentro dele','Todas as camadas P44 a P197 estao dentro dele',1)
          note='''### P197 · 2026-09-20 · Capa mais limpa e swipe leve\n- Swipe passa com gesto curto (aprox. 35–58 px) ou movimento rápido, sem exigir força.\n- Fontes antigas do painel ficam invisíveis na capa, mas continuam alimentando os cards.\n- Remove o AGORA duplicado, melhora hierarquia de título, metadado e descrição.\n- Botões recebem visual próprio de app e o próximo vira seta circular.\n- Incluída dica discreta ↔ deslize.\n- Não alterado: dados, Firebase, regras, VPS ou permissões.\n\n'''
          r=r.replace('### P196 · 2026-09-20 · Swipe físico nos passa-cards',note+'### P196 · 2026-09-20 · Swipe físico nos passa-cards',1)
          rm.write_text(r,encoding='utf-8')

          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')

          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p197-{i}.mjs')
            p.write_text(b,encoding='utf-8')
            z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode:
              print('JS block',i,'failed')
              print(z.stderr)
              sys.exit(1)
          print('validated',len(blocks),'script blocks; P197 anchors applied')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p197-home-polish.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P197: capa limpa e swipe leve [p197-applied]"
          git push
