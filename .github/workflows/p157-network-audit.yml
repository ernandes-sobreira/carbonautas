name: P157 network audit
on:
  push:
    branches: [fix/p157-network-core]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit graph engine
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['forceSimulation','forceLink','stroke-width','function buildLinks','function renderGraph']
          out=[]
          for needle in needles:
              out.append('\n### '+needle)
              pos=0
              count=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  a=max(0,i-700); b=min(len(s),i+1500)
                  out.append(s[a:b])
                  pos=i+len(needle); count+=1
                  if count>=8: break
          Path('p157-network-audit.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit audit report
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add p157-network-audit.txt
          git commit -m "P157: audit network engine" || exit 0
          git push
