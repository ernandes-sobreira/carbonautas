name: P204 publish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p204-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P204
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha512sum index.html | awk '{print $1}')" = "41c0e6a876ce831dbd76737a3d22c84cc47c0301b37ffb89442a057124188f7b9e4724c589dc13ad552341d6971d4d05ca6b994ab3c291f7c535d0b127abe05c"
          cat > /tmp/p204.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          tr -d '[:space:]' < /tmp/p204.patch.gz.b64 | base64 -d | gzip -d > /tmp/p204.patch
          git apply --check /tmp/p204.patch
          git apply /tmp/p204.patch
          sha512sum -c index.html.sha512
          node --check sw.js
          grep -q "window.CARBONAUTAS_BUILD='P204-20260921'" index.html
          grep -q 'data-carbonautas-p204-chat-router="1"' index.html
          grep -q 'window.closePanelinhas=leave' index.html
          grep -q 'window.renderPrivateThreads=renderPrivateThreads' index.html
      - name: Publicar P204
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js index.html.sha512
          git diff --check --cached
          git commit -m "P204: corrigir privadas, panelinhas, download e visualizador [p204-applied]"
          git push
