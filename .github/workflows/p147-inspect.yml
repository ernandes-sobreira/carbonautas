name: P147 inspect cronograma repository wiring
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect cronograma category wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for needle in ['function refreshPubFilters()', 'const CATEGORIAS = {', 'value="cronograma"', "label:'Cronograma'", 'repoCategory']:
              print(needle, s.count(needle))
          PY
