name: P131 dossier analytics loader
on:
  push:
    branches: [P131-dossier-loader]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject P131 loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./dossier-analytics-p131.js?v=P131-20260919"></script>'
          if 'dossier-analytics-p131.js' not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html sem </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s)
          PY
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P131: dossiê com contabilidade individual de uso e ações"
          git push origin HEAD:main
