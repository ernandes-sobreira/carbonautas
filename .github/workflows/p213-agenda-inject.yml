name: P213 inject agenda core
on:
  push:
    branches: [agenda-rebuild-p213]
permissions:
  contents: write
jobs:
  inject:
    if: "${{ !contains(github.event.head_commit.message, '[p213-injected]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Injetar apenas os módulos isolados da Agenda
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="./modules/agenda-core-p213.js?v=P213-20260921"></script>',
            '<script src="./modules/agenda-integration-p213.js?v=P213-20260921"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  if '</body>' not in s: raise SystemExit('index sem </body>')
                  s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'agenda-core-p213.js' index.html
          grep -q 'agenda-integration-p213.js' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "P213: carregar módulos isolados da Agenda [p213-injected]"
          git push
