name: P200 destaques tab
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: "${{ !contains(github.event.head_commit.message, '[p200-applied]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P200 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,sys

          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')

          group_old="mural:{views:['mural','fotos'],labels:{mural:'Mural',fotos:'Fotos'},badges:{mural:'muralBadge'}},"
          group_new="mural:{views:['mural','fotos','destaques'],labels:{mural:'Mural',fotos:'Fotos',destaques:'Destaques'},badges:{mural:'muralBadge'}},"
          map_old="mural:'viewMural',fotos:'viewFotos',pubs:'viewPubs'"
          map_new="mural:'viewMural',fotos:'viewFotos',destaques:'viewDestaques',pubs:'viewPubs'"

          ensure_old="""function ensurePanel(){
            let host=$('#p117Highlights');if(host)return host;
            host=document.createElement('section');host.id='p117Highlights';
            const msgs=$('#viewMural #muralMsgs'),mural=$('#viewMural .mural-board');
            if(msgs)msgs.appendChild(host);else if(mural)mural.appendChild(host);else $('#viewMural')?.appendChild(host);
            return host;
          }"""
          ensure_new="""function ensurePanel(){
            let host=$('#p117Highlights');
            const dest=$('#viewDestaques .p200-highlights-wrap');
            if(host){if(dest&&host.parentElement!==dest)dest.appendChild(host);return host}
            host=document.createElement('section');host.id='p117Highlights';
            if(dest)dest.appendChild(host);else $('#viewDestaques')?.appendChild(host);
            return host;
          }"""

          reloc_old="function relocatePanel(){const host=$('#p117Highlights'),msgs=$('#viewMural #muralMsgs');if(!host||!msgs)return;if(host.parentElement!==msgs||host!==msgs.lastElementChild)msgs.appendChild(host)}"
          reloc_new="function relocatePanel(){const host=$('#p117Highlights'),dest=$('#viewDestaques .p200-highlights-wrap');if(!host||!dest)return;if(host.parentElement!==dest)dest.appendChild(host)}"

          notif_old="try{if(typeof window.switchView==='function')window.switchView('mural');else if(typeof switchView==='function')switchView('mural')}catch(_e){};const x=items.find(i=>i.id===n.sourceId);"
          notif_new="try{if(typeof window.switchView==='function')window.switchView('destaques');else if(typeof switchView==='function')switchView('destaques')}catch(_e){};const x=items.find(i=>i.id===n.sourceId);"

          version_old="window.CARBONAUTAS_BUILD='P199-20260920';"
          swreg_old="navigator.serviceWorker.register('./sw.js?v=P199-20260920',{updateViaCache:'none'})"
          lab_anchor='  <!-- ============ VIEW: LABORATÓRIO DE DADOS ============ -->'

          required=[group_old,map_old,ensure_old,reloc_old,notif_old,version_old,swreg_old,lab_anchor]
          for a in required:
            assert a in s, 'anchor missing: '+a[:160]
          assert 'id="viewDestaques"' not in s

          s=s.replace(group_old,group_new,1)
          s=s.replace(map_old,map_new,1)
          s=s.replace(ensure_old,ensure_new,1)
          s=s.replace(reloc_old,reloc_new,1)
          s=s.replace(notif_old,notif_new,1)

          view='''  <!-- ============ VIEW: DESTAQUES ============ -->
          <div class="view" id="viewDestaques">
            <div class="p200-highlights-scroll">
              <div class="p200-highlights-wrap"></div>
            </div>
          </div>

'''
          s=s.replace(lab_anchor,view+lab_anchor,1)

          css='''
<style id="p200DestaquesTabStyle">
#viewDestaques{overflow:hidden;background:linear-gradient(180deg,#f7fbfa 0%,#f4f8f7 100%)!important}
#viewDestaques .p200-highlights-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#viewDestaques .p200-highlights-wrap{width:100%;max-width:980px;margin:0 auto;padding:18px 18px 120px}
#viewDestaques #p117Highlights{margin:0!important;width:100%!important;box-sizing:border-box}
#viewMural .mural-filterbar-pro{flex:0 0 auto!important;min-height:50px!important;align-items:center!important}
@media(max-width:700px){
  #viewDestaques .p200-highlights-wrap{padding:12px 14px 118px}
  #viewDestaques .p117-deck{grid-auto-columns:minmax(255px,88%)!important}
  #viewDestaques .p117-head{gap:8px}
}
</style>
'''
          anchor='<style id="p199HighlightsBottomStyle">'
          assert anchor in s
          s=s.replace(anchor,css+'\n'+anchor,1)

          s=s.replace(version_old,"window.CARBONAUTAS_BUILD='P200-20260920';",1)
          s=s.replace(swreg_old,"navigator.serviceWorker.register('./sw.js?v=P200-20260920',{updateViaCache:'none'})",1)
          idx.write_text(s,encoding='utf-8')

          sw=Path('sw.js');w=sw.read_text(encoding='utf-8')
          assert 'service worker P199' in w and 'carbonautas-p199-20260920' in w
          w=w.replace('service worker P199','service worker P200',1).replace('carbonautas-p199-20260920','carbonautas-p200-20260920',1)
          sw.write_text(w,encoding='utf-8')

          rm=Path('README.md');r=rm.read_text(encoding='utf-8')
          assert 'Todas as camadas P44 a P199 estao dentro dele' in r
          assert '### P199 · 2026-09-20 · Destaques no fim do Mural' in r
          r=r.replace('Todas as camadas P44 a P199 estao dentro dele','Todas as camadas P44 a P200 estao dentro dele',1)
          note='''### P200 · 2026-09-20 · Destaques viram aba própria\n- Ó nóis! passa a ter três abas: Mural, Fotos e Destaques.\n- Destaques do mês saem completamente do feed e ganham tela própria rolável.\n- Notificações de Destaques abrem diretamente nessa nova aba.\n- Corrigido o encolhimento da barra de filtros do Mural no celular.\n- Não alterado: dados, Firebase, regras, VPS ou permissões.\n\n'''
          r=r.replace('### P199 · 2026-09-20 · Destaques no fim do Mural',note+'### P199 · 2026-09-20 · Destaques no fim do Mural',1)
          rm.write_text(r,encoding='utf-8')

          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')

          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p200-{i}.mjs');p.write_text(b,encoding='utf-8')
            z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode:
              print('JS block',i,'failed')
              print(z.stderr)
              sys.exit(1)
          print('validated',len(blocks),'script blocks')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p200-destaques-tab.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P200: Destaques em aba propria [p200-applied]"
          git push
