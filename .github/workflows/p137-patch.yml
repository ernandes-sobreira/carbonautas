name: P137 collapse access roster
on:
  push:
    branches: ["fix/access-collapse-2026-09-19"]
    paths: [".github/workflows/p137-patch.yml"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/access-collapse-2026-09-19
      - name: Collapse access roster by default
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  if(box.dataset.sig===sig)return;box.dataset.sig=sig;
  box.innerHTML=`<div class=\"p128-head\">Acessos <small>${hoje} hoje · ${rows.length} pessoas</small></div><div class=\"p128-grid\">${rows.map(r=>`<div class=\"p128-chip ${cls(r.t)}\" title=\"${esc(r.m.nome||'')}\"><i></i><b>${esc(first(r.m.nome))}</b><span>${ago(r.t)}</span></div>`).join('')}</div>`;
}"""
          new="""  if(box.dataset.sig===sig)return;box.dataset.sig=sig;
  const wasOpen=!!box.querySelector('details')?.open;
  box.innerHTML=`<details class=\"p137-presence-details\" ${wasOpen?'open':''}><summary class=\"p128-head p137-presence-summary\"><span class=\"p137-presence-title\">👥 Acessos da equipe</span><small>${hoje} hoje · ${rows.length} pessoas</small><span class=\"p137-presence-action\"><span class=\"p137-show\">Ver</span><span class=\"p137-hide\">Fechar</span></span></summary><div class=\"p128-grid\">${rows.map(r=>`<div class=\"p128-chip ${cls(r.t)}\" title=\"${esc(r.m.nome||'')}\"><i></i><b>${esc(first(r.m.nome))}</b><span>${ago(r.t)}</span></div>`).join('')}</div></details>`;
}"""
          if old not in s:
              raise SystemExit('renderPresence target not found exactly')
          s=s.replace(old,new,1)
          oldcss="""#p128Presence{margin:0 0 14px}
#p128Presence .p128-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-weight:800;color:#162e39}
#p128Presence .p128-head small{font-weight:600;color:#71868b}
#p128Presence .p128-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}"""
          newcss="""#p128Presence{margin:0 0 10px}
#p128Presence .p137-presence-details{border:1px solid #dfe9e6;border-radius:14px;background:#f8fbfa;overflow:hidden}
#p128Presence .p128-head{display:flex;align-items:center;gap:8px;margin:0;padding:10px 12px;font-weight:800;color:#162e39;cursor:pointer;list-style:none;min-height:44px}
#p128Presence .p128-head::-webkit-details-marker{display:none}
#p128Presence .p128-head::marker{display:none;content:''}
#p128Presence .p137-presence-title{white-space:nowrap}
#p128Presence .p128-head small{font-weight:600;color:#71868b;min-width:0}
#p128Presence .p137-presence-action{margin-left:auto;flex:0 0 auto;color:#0f777b;font-size:11px;font-weight:850;padding:5px 9px;border:1px solid #cfe4df;border-radius:999px;background:#fff}
#p128Presence .p137-hide{display:none}
#p128Presence details[open] .p137-show{display:none}
#p128Presence details[open] .p137-hide{display:inline}
#p128Presence .p128-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:4px 10px 10px;border-top:1px solid #e7efed}
@media(max-width:620px){#p128Presence .p128-head{padding:9px 10px;gap:6px;flex-wrap:wrap}#p128Presence .p137-presence-title{font-size:12px}#p128Presence .p128-head small{font-size:10.5px}#p128Presence .p137-presence-action{font-size:10px;padding:4px 8px}#p128Presence .p128-grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:7px 8px 9px}}"""
          if oldcss not in s:
              raise SystemExit('presence CSS target not found exactly')
          s=s.replace(oldcss,newcss,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          git diff --check
          grep -q 'p137-presence-details' index.html
          grep -q 'Acessos da equipe' index.html
          grep -q 'const wasOpen' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('p137-presence-details') >= 2
          assert 'setInterval' not in s[s.find('p137-presence-details')-300:s.find('p137-presence-details')+3500]
          print('P137 validation OK')
          PY
      - name: Commit patch
        run: |
          git config user.name "ernandes-sobreira"
          git config user.email "156730719+ernandes-sobreira@users.noreply.github.com"
          git add index.html
          git commit -m "P137: recolher acessos no painel principal"
          git push origin HEAD:fix/access-collapse-2026-09-19
