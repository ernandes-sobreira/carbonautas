name: P222 Contrast diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect mural command styles
        shell: bash
        run: |
          echo '--- mural command/action CSS ---'
          grep -n -C 8 -E '\.mural-command|\.mural-action|\.ma-title|\.ma-sub' index.html || true
