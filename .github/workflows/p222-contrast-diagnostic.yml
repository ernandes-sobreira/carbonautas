name: P222 Contrast diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact mural shortcut CSS
        shell: bash
        run: |
          echo '--- pubNeed selectors with context ---'
          grep -n -C 12 -E 'pubNeedCard|pubNeedBox|pubNeedToggle|pubNeedGrid' index.html || true
          echo '--- rules forcing white text in publicacoes ---'
          grep -n -C 8 -E 'view-publicacoes.*color|color:[[:space:]]*#fff[[:space:]]*!important|color:[[:space:]]*white[[:space:]]*!important' index.html || true
