name: P222 Fix mural contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-mural-contrast:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix light-theme mural shortcut contrast
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker=".mural-filter.on{background:#dff3ef!important;color:#0c7177!important;border-color:#bfe1d9!important}\n#viewLab"
          if text.count(marker)!=1:
              raise SystemExit(f'ABORT: marcador do tema do Mural encontrado {text.count(marker)} vez(es)')

          css="""
/* P222 · contraste correto dos atalhos do Mural no tema claro */
#viewMural .mural-command{color:#173d4c!important}
#viewMural .mural-command h2{color:#153b4b!important}
#viewMural .mural-command p{color:#667f89!important}
#viewMural .mural-command-toggle{background:#fff!important;border-color:#cfe2de!important;color:#315763!important;box-shadow:0 4px 14px rgba(25,69,78,.045)!important}
#viewMural .mural-command-toggle:hover{background:#f7fbfa!important;border-color:#b8d7d1!important;color:#164b57!important}
#viewMural .mural-action{background:rgba(255,255,255,.90)!important;border-color:#d5e6e2!important;color:#173d4c!important;box-shadow:0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action:hover{background:#fff!important;border-color:#bddbd5!important;box-shadow:0 9px 22px rgba(25,69,78,.07)!important}
#viewMural .mural-action .ma-title{color:#173d4c!important}
#viewMural .mural-action .ma-sub{color:#6d838c!important}
#viewMural .mural-action.campo{box-shadow:inset 0 3px 0 #32C875,0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action.lab{box-shadow:inset 0 3px 0 #57A8FF,0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action.dados{box-shadow:inset 0 3px 0 #A47CFF,0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action.ajuda{box-shadow:inset 0 3px 0 #FFB648,0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action.alerta{background:#fff7f8!important;box-shadow:inset 0 3px 0 #FF4B63,0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action.ideia{box-shadow:inset 0 3px 0 #FFD95E,0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action.resenha{box-shadow:inset 0 3px 0 #FF72B5,0 6px 18px rgba(25,69,78,.035)!important}
#viewMural .mural-action.outro{box-shadow:inset 0 3px 0 #72E6E0,0 6px 18px rgba(25,69,78,.035)!important}
"""
          text=text.replace(marker, marker.replace('\n#viewLab','\n')+css+'#viewLab',1)
          p.write_text(text,encoding='utf-8')

          required=[
            '#viewMural .mural-command h2{color:#153b4b!important}',
            '#viewMural .mural-action .ma-title{color:#173d4c!important}',
            '#viewMural .mural-action .ma-sub{color:#6d838c!important}'
          ]
          for rule in required:
              if rule not in text: raise SystemExit('ABORT: regra ausente: '+rule)
          print('P222: contraste claro do Mural corrigido e verificado.')
          PY
      - name: Commit contrast fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "P222: corrigir contraste dos atalhos do mural"
          git push
