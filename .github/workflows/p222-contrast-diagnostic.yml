name: P222 Contrast diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate exact shortcut source in repository
        shell: bash
        run: |
          echo '--- pubNeed anywhere ---'
          grep -RIn -C 10 -E 'pubNeed(Card|Box|Toggle|Grid)|O que você precisa do grupo|PRECISO DE AJUDA PRA CAMPO|Mostrar atalhos' . --exclude-dir=.git --exclude='package-lock.json' || true
          echo '--- css descendants forcing white ---'
          grep -RIn -C 7 -E '(pubNeed|view-publicacoes|mural).*(\*|div|button|b|small).*color:[[:space:]]*(#fff|white).*important|color:[[:space:]]*(#fff|white).*important.*(pubNeed|view-publicacoes|mural)' . --exclude-dir=.git --exclude='package-lock.json' || true
