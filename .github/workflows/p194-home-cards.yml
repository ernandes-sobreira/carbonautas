name: P194 home cards flutuantes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p194-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P194 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess, sys
          idx=Path('index.html'); s=idx.read_text(encoding='utf-8')
          required=[
            'dash-grid p142-home-grid',
            "window.CARBONAUTAS_BUILD='P193-20260920';",
            "navigator.serviceWorker.register('./sw.js?v=P193-20260920',{updateViaCache:'none'})"
          ]
          for a in required:
            assert a in s, f'anchor missing: {a}'
          assert 'p194HomeFloatingCardsStyle' not in s
          b64=''
          layer=base64.b64decode(b64).decode('utf-8')
          pos=s.rfind('</body>'); assert pos>=0, 'closing body missing'
          s=s[:pos]+layer+'\n'+s[pos:]
          s=s.replace("window.CARBONAUTAS_BUILD='P193-20260920';","window.CARBONAUTAS_BUILD='P194-20260920';")
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=P193-20260920',{updateViaCache:'none'})","navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})")
          idx.write_text(s,encoding='utf-8')
          sw=Path('sw.js'); t=sw.read_text(encoding='utf-8')
          assert 'service worker P193' in t and "const CACHE='carbonautas-p193-20260920';" in t
          t=t.replace('service worker P193','service worker P194').replace("const CACHE='carbonautas-p193-20260920';","const CACHE='carbonautas-p194-20260920';")
          sw.write_text(t,encoding='utf-8')
          readme=Path('README.md'); r=readme.read_text(encoding='utf-8')
          assert 'Todas as camadas P44 a P193 estao dentro dele' in r
          marker='### P193 · 2026-09-20 · Menos polling redundante'; assert marker in r
          r=r.replace('Todas as camadas P44 a P193 estao dentro dele','Todas as camadas P44 a P194 estao dentro dele',1)
          sec='''### P194 · 2026-09-20 · Home em cards flutuantes\n- Nova hierarquia visual no Painel: “Precisa de você”, “Só acompanhar” e “Atalhos” em destaque.\n- Mural, Agenda, Repositório e Pessoas viram atalhos compactos.\n- Saúde dos projetos, produtos e check-in ficam recolhidos em “Mais do painel”.\n- “Sobre o Carbonautas” e “Lab” ficam discretos no rodapé.\n- Não alterado: dados, regras do Firebase, VPS ou permissões.\n\n'''
          r=r.replace(marker,sec+marker,1); readme.write_text(r,encoding='utf-8')
          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p194-{i}.mjs'); p.write_text(b,encoding='utf-8')
            z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode:
              print(f'JS block {i} failed\n{z.stderr}'); sys.exit(1)
          assert s.count('p194HomeFloatingCardsStyle')==1
          assert s.count('p194HomeFloatingCardsController')==1
          print(f'Validated {len(blocks)} inline script blocks')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/p194-home-cards.yml .github/workflows/p194-fix-anchors.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P194: home em cards flutuantes [p194-applied]"
          git push
