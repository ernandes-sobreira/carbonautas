name: P194 home cards flutuantes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[p194-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar P194 e validar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess,sys

          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')

          # Âncoras atuais obrigatórias: se algo mudou, aborta sem tocar no app.
          anchors=[
            '<div class="dash-grid p142-home-grid">',
            'id=\'p145QuickActions\'',
            'id=\'p144TodayDetails\'',
            "window.CARBONAUTAS_BUILD='P193-20260920';",
            "navigator.serviceWorker.register('./sw.js?v=P193-20260920',{updateViaCache:'none'})"
          ]
          for a in anchors:
            assert s.count(a)==1, f'anchor count {s.count(a)}: {a}'
          assert s.count('</body>')==1
          assert 'p194HomeFloatingCardsStyle' not in s

          layer=r'''
<style id="p194HomeFloatingCardsStyle">
/* P194 · Home mais leve, em cards flutuantes, sem alterar os dados */
#viewPainel .dash-wrap{max-width:1180px!important}
#viewPainel #p194Welcome{margin:0 0 14px;padding:18px 20px;border:1px solid #d9e8e5;border-radius:24px;background:linear-gradient(135deg,#ffffff 0%,#f3fbf8 100%);box-shadow:0 14px 38px rgba(18,66,73,.07);display:flex;align-items:center;gap:18px;justify-content:space-between}
#viewPainel #p194Welcome .p194-kicker{font-size:10px;font-weight:900;letter-spacing:.14em;color:#16858a;text-transform:uppercase}
#viewPainel #p194Welcome h2{font-family:'Space Grotesk','Inter',sans-serif;margin:3px 0 4px;color:#173b4b;font-size:25px;letter-spacing:-.035em}
#viewPainel #p194Welcome p{margin:0;color:#72868e;font-size:12.5px;line-height:1.4}
#viewPainel #p194Welcome .p194-welcome-actions{display:flex;gap:8px;flex:0 0 auto}
#viewPainel #p194Welcome .p194-welcome-actions .btn{min-height:42px;border-radius:13px;padding:9px 13px}
#viewPainel .p142-command-intro{grid-column:1/-1!important;padding:2px 2px 3px!important}
#viewPainel .p142-command-intro h3{font-size:20px!important}
#viewPainel .p142-command-intro .dash-sub{display:block!important;white-space:normal!important}
#viewPainel .p142-command-card{display:grid!important;grid-template-columns:repeat(12,minmax(0,1fr))!important;gap:14px!important;align-items:start!important}
#viewPainel .p142-command-card>.p142-accordion{margin:0!important;min-width:0!important;box-shadow:0 12px 34px rgba(19,67,75,.07)!important;border-color:#dce9e7!important;background:#fff!important}
#viewPainel .p142-command-card>.p142-accordion.p194-action{grid-column:span 5}
#viewPainel .p142-command-card>.p142-accordion.p194-watch{grid-column:span 4}
#viewPainel .p142-command-card>.p142-accordion.p194-short{grid-column:span 3}
#viewPainel .p142-command-card>.p142-accordion[open]{grid-column:1/-1!important}
#viewPainel .p142-command-card>.p142-accordion>summary{min-height:96px!important;align-items:flex-start!important;padding:16px!important}
#viewPainel .p142-command-card>.p142-accordion>summary .p142-icon{margin-top:1px!important}
#viewPainel .p142-command-card>.p142-accordion>summary .p142-label b{font-size:17px!important}
#viewPainel .p142-command-card>.p142-accordion>summary .p142-label small{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.35!important;margin-top:3px!important}
#viewPainel #p194MorePanel{grid-column:1/-1!important;background:#f8fbfa!important;box-shadow:none!important}
#viewPainel #p194MorePanel>summary{min-height:66px!important;align-items:center!important}
#viewPainel #p194MoreBody{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:12px}
#viewPainel #p194MoreBody>.p142-accordion{margin:0!important;border-radius:16px!important;background:#fff!important;box-shadow:none!important}
#viewPainel #p194MoreBody>.p142-accordion>summary{min-height:66px!important;padding:10px 11px!important}
#viewPainel #p194Shortcuts{grid-column:1/-1!important;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:1px}
#viewPainel .p194-nav-card{border:1px solid #dce9e7;background:#fff;border-radius:18px;padding:14px;display:flex;gap:11px;align-items:center;cursor:pointer;text-align:left;min-width:0;box-shadow:0 9px 26px rgba(19,67,75,.045);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
#viewPainel .p194-nav-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(19,67,75,.08);border-color:#c7dfda}
#viewPainel .p194-nav-ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#eef7f5;font-size:18px;flex:0 0 38px}
#viewPainel .p194-nav-card b{display:block;color:#173b4b;font-size:13px;line-height:1.2}
#viewPainel .p194-nav-card small{display:block;color:#83949b;font-size:10.5px;line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewPainel #p194FooterLinks{display:flex;justify-content:center;gap:8px;padding:18px 8px 28px}
#viewPainel #p194FooterLinks button{border:1px solid transparent;background:transparent;color:#6f858d;border-radius:999px;padding:9px 13px;font-size:11.5px;font-weight:800;cursor:pointer}
#viewPainel #p194FooterLinks button:hover{background:#eef7f5;color:#0d7479;border-color:#d9e9e6}
#viewPainel #p192AboutFooter{display:none!important}
@media(max-width:920px){
  #viewPainel .p142-command-card>.p142-accordion.p194-action,#viewPainel .p142-command-card>.p142-accordion.p194-watch{grid-column:span 6}
  #viewPainel .p142-command-card>.p142-accordion.p194-short{grid-column:1/-1}
  #viewPainel #p194Shortcuts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  #viewPainel #p194Welcome{padding:15px;border-radius:20px;display:block}
  #viewPainel #p194Welcome h2{font-size:22px}
  #viewPainel #p194Welcome .p194-welcome-actions{display:grid;grid-template-columns:1fr 1fr;margin-top:12px}
  #viewPainel .p142-command-card{display:block!important}
  #viewPainel .p142-command-card>.p142-accordion{margin:9px 0!important}
  #viewPainel .p142-command-card>.p142-accordion>summary{min-height:78px!important;align-items:center!important;padding:11px!important}
  #viewPainel .p142-command-card>.p142-accordion>summary .p142-label b{font-size:15.5px!important}
  #viewPainel #p194MoreBody{grid-template-columns:1fr;gap:8px}
  #viewPainel #p194Shortcuts{grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
  #viewPainel .p194-nav-card{padding:11px 10px;border-radius:16px}
  #viewPainel .p194-nav-ico{width:34px;height:34px;flex-basis:34px;font-size:16px}
  #viewPainel .p194-nav-card small{display:none}
}
</style>
<script id="p194HomeFloatingCardsController">
(()=>{
  'use strict';
  const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  function clickExisting(sel){const b=q(sel);if(b){b.click();return true}return false}
  function openByLabel(words){
    const els=qa('.tab[data-view],.app-nav-card[data-app-view]');
    const hit=els.find(el=>words.some(w=>norm(el.textContent).includes(norm(w))));
    if(hit){hit.click();return true}return false;
  }
  function label(details,title,small,icon){
    if(!details)return;
    const b=q('.p142-label b',details),s=q('.p142-label small',details),i=q('.p142-icon',details);
    if(b)b.textContent=title;if(s)s.textContent=small;if(i)i.textContent=icon;
  }
  function ensureWelcome(home){
    let card=q('#p194Welcome');
    if(!card){
      card=document.createElement('section');card.id='p194Welcome';
      card.innerHTML='<div><div class="p194-kicker">CARBONAUTAS</div><h2>Bora ver o que importa?</h2><p>Menos tela cheia. Ação rápida primeiro; detalhes só quando você abrir.</p></div><div class="p194-welcome-actions"><button class="btn" type="button" data-p194="checkin">✓ Check-in</button><button class="btn primary" type="button" data-p194="produto">🎯 Registrar produto</button></div>';
      card.addEventListener('click',e=>{const a=e.target.closest('[data-p194]');if(!a)return;if(a.dataset.p194==='checkin')clickExisting('#dashCheckinBtn');if(a.dataset.p194==='produto')clickExisting('#dashProductBtn')});
    }
    const high=q('#p117Highlights');
    const parent=home.parentElement;
    if(parent){const anchor=high||home;if(card.parentElement!==parent||card.nextElementSibling!==anchor)parent.insertBefore(card,anchor)}
  }
  function ensureShortcuts(command){
    let box=q('#p194Shortcuts');
    if(!box){
      box=document.createElement('section');box.id='p194Shortcuts';
      box.innerHTML='\
<button class="p194-nav-card" type="button" data-go="mural"><span class="p194-nav-ico">💬</span><span><b>Mural</b><small>Recados, pedidos e alertas.</small></span></button>\
<button class="p194-nav-card" type="button" data-go="agenda"><span class="p194-nav-ico">🗓️</span><span><b>Agenda</b><small>Compromissos e reuniões.</small></span></button>\
<button class="p194-nav-card" type="button" data-go="repo"><span class="p194-nav-ico">📁</span><span><b>Repositório</b><small>Arquivos e pastas da Rede.</small></span></button>\
<button class="p194-nav-card" type="button" data-go="pessoas"><span class="p194-nav-ico">🧭</span><span><b>Pessoas</b><small>Rede e acompanhamento.</small></span></button>';
      box.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const k=b.dataset.go;if(k==='mural')openByLabel(['mural']);if(k==='agenda')openByLabel(['agenda']);if(k==='repo')openByLabel(['repositorio','repositório']);if(k==='pessoas')openByLabel(['rede','pessoas','acompanhamento'])});
    }
    if(box.parentElement!==command)command.appendChild(box);
  }
  function ensureFooter(home){
    const wrap=q('#viewPainel .dash-wrap');if(!wrap)return;
    let foot=q('#p194FooterLinks');
    if(!foot){foot=document.createElement('div');foot.id='p194FooterLinks';foot.innerHTML='<button type="button" data-foot="about">ⓘ Sobre o Carbonautas</button><button type="button" data-foot="lab">🧪 Lab</button>';foot.addEventListener('click',e=>{const b=e.target.closest('[data-foot]');if(!b)return;if(b.dataset.foot==='about'){if(typeof window.openCarbonautasAbout==='function')window.openCarbonautasAbout();else q('#p78AboutBtn')?.click()}else openByLabel(['lab','laboratorio','laboratório'])})}
    if(foot.parentElement!==wrap||wrap.lastElementChild!==foot)wrap.appendChild(foot);
  }
  function arrange(){
    const home=q('#viewPainel .p142-home-grid'),command=q('#viewPainel .p142-command-card');if(!home||!command)return false;
    ensureWelcome(home);
    const direct=qa(':scope > details.p142-accordion',command);
    const quick=q('#p145QuickActions'),today=q('#p144TodayDetails');
    const attention=direct.find(x=>x!==quick&&x!==today&&/atencao agora|precisa de voce/.test(norm(x.textContent)))||direct.find(x=>x!==quick&&x!==today);
    if(attention){attention.classList.add('p194-action');label(attention,'Precisa de você','Prazos, correções e pendências que pedem ação.','⚡')}
    if(today){today.classList.add('p194-watch');label(today,'Só acompanhar','Novidades e mudanças que vale observar.','👀')}
    if(quick){quick.classList.add('p194-short');label(quick,'Atalhos','Check-in, produto, dossiê e backup.','⚙️')}
    const intro=q('.p142-command-intro',command);
    if(intro&&attention)intro.insertAdjacentElement('afterend',attention);
    if(attention&&today)attention.insertAdjacentElement('afterend',today);
    if(today&&quick)today.insertAdjacentElement('afterend',quick);

    let more=q('#p194MorePanel');
    if(!more){more=document.createElement('details');more.id='p194MorePanel';more.className='p142-accordion';more.innerHTML='<summary><span class="p142-icon">＋</span><span class="p142-label"><b>Mais do painel</b><small>Saúde dos projetos, produtos e fechamento mensal.</small></span><span class="p142-toggle"><span class="p142-show">Ver</span><span class="p142-hide">Fechar</span></span></summary><div class="p142-body" id="p194MoreBody"></div>'}
    const body=q('#p194MoreBody',more);
    const extras=qa(':scope > details.p142-accordion',command).filter(x=>x!==attention&&x!==today&&x!==quick&&x!==more);
    extras.forEach(x=>body.appendChild(x));
    if(more.parentElement!==command)command.appendChild(more);
    ensureShortcuts(command);ensureFooter(home);
    return true;
  }
  function boot(){if(arrange())return;const root=q('#viewPainel')||document.body;const ob=new MutationObserver(()=>{if(arrange())ob.disconnect()});ob.observe(root,{childList:true,subtree:true});setTimeout(()=>{arrange();ob.disconnect()},7000)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>
'''
          s=s.replace('</body>',layer+'\n</body>')
          s=s.replace("window.CARBONAUTAS_BUILD='P193-20260920';","window.CARBONAUTAS_BUILD='P194-20260920';")
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=P193-20260920',{updateViaCache:'none'})","navigator.serviceWorker.register('./sw.js?v=P194-20260920',{updateViaCache:'none'})")
          idx.write_text(s,encoding='utf-8')

          sw=Path('sw.js');t=sw.read_text(encoding='utf-8')
          assert t.count('service worker P193')==1 and t.count("const CACHE='carbonautas-p193-20260920';")==1
          t=t.replace('service worker P193','service worker P194').replace("const CACHE='carbonautas-p193-20260920';","const CACHE='carbonautas-p194-20260920';")
          sw.write_text(t,encoding='utf-8')

          readme=Path('README.md');r=readme.read_text(encoding='utf-8')
          assert r.count('Todas as camadas P44 a P193 estao dentro dele')==1
          marker='### P193 · 2026-09-20 · Menos polling redundante'
          assert r.count(marker)==1
          r=r.replace('Todas as camadas P44 a P193 estao dentro dele','Todas as camadas P44 a P194 estao dentro dele')
          sec='''### P194 · 2026-09-20 · Home em cards flutuantes\n- Nova hierarquia visual no Painel: saudação curta, “Precisa de você”, “Só acompanhar” e “Atalhos” em destaque.\n- Mural, Agenda, Repositório e Pessoas viram atalhos compactos.\n- Saúde dos projetos, produtos e check-in ficam recolhidos em “Mais do painel”.\n- “Sobre o Carbonautas” e “Lab” ficam discretos no rodapé.\n- Não alterado: dados, regras do Firebase, VPS ou permissões.\n\n'''
          r=r.replace(marker,sec+marker);readme.write_text(r,encoding='utf-8')

          Path('index.html.sha512').write_text(hashlib.sha512(idx.read_bytes()).hexdigest()+'  index.html\n',encoding='utf-8')

          # Validação sintática de todos os scripts inline e integridade básica.
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          for i,b in enumerate(blocks):
            p=Path(f'/tmp/p194-{i}.mjs');p.write_text(b,encoding='utf-8')
            z=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
            if z.returncode:
              print(f'JS block {i} failed\n{z.stderr}');sys.exit(1)
          assert s.count('id="p194Welcome"')==0, 'welcome is runtime-only; static duplicate found'
          assert s.count('p194HomeFloatingCardsStyle')==1
          assert s.count('p194HomeFloatingCardsController')==1
          print(f'Validated {len(blocks)} inline script blocks')
          PY
          sha512sum -c index.html.sha512
          git diff --check
      - name: Commit validado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p194-home-cards.yml
          git add index.html sw.js README.md index.html.sha512
          git commit -m "P194: home em cards flutuantes [p194-applied]"
          git push
