name: P220 restore file controls
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    if: "${{ !contains(github.event.head_commit.message, '[p220-injected]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar P220
        run: node --check modules/repository-ui-p220.js
      - name: Ativar P220 e renovar cache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./modules/repository-ui-p220.js?v=P220-20260922"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('index sem </body>')
              s=s[:pos]+tag+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          if sw.exists():
              t=sw.read_text(encoding='utf-8')
              import re
              t=re.sub(r"const CACHE='carbonautas-[^']+';", "const CACHE='carbonautas-p220-20260922';", t, count=1)
              sw.write_text(t,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p220-inject.yml
          git add index.html sw.js
          git commit -m "P220: restaurar botoes modernos no repositorio e Arquivo Vivo [p220-injected]"
          git push
