<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbonautas · Recuperação</title>
<style>html,body{height:100%;margin:0;font-family:system-ui;background:#f7fbfb;color:#16262c}main{height:100%;display:grid;place-items:center}div{text-align:center;max-width:520px;padding:28px}h1{margin:0 0 10px;font-size:26px}p{color:#60757d}</style>
</head>
<body>
<main><div><h1>Corrigindo o Carbonautas…</h1><p>Removendo a versão antiga do navegador e carregando a versão corrigida.</p></div></main>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('carbonautas-')).map(k=>caches.delete(k)));
    }
  }catch(e){console.warn(e)}
  location.replace('./?recovered='+Date.now());
})();
</script>
</body>
</html>
