<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbonautas · Atualização P109</title>
<style>html,body{height:100%;margin:0;font-family:system-ui;background:#f6faf9;color:#183844}main{height:100%;display:grid;place-items:center}div{text-align:center;max-width:560px;padding:28px}h1{margin:0 0 10px;font-size:26px}p{color:#60757d;line-height:1.5}.ok{color:#087f5b;font-weight:700}</style>
</head>
<body>
<main><div><h1>Atualizando o Carbonautas…</h1><p id="msg">Transformando a Agenda em pastas e cards deslizantes.</p></div></main>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  try{
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('carbonautas-')).map(k=>caches.delete(k)));}
    if('serviceWorker' in navigator){
      msg.textContent='Atualizando a Agenda P109…';
      const reg=await navigator.serviceWorker.register('./sw.js?v=P109-20260918',{updateViaCache:'none'});
      await reg.update();
      if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
      const worker=reg.active||reg.waiting||reg.installing;if(worker)worker.postMessage('FORCE_REFRESH_ALL');
      await wait(700);
    }
    msg.className='ok';msg.textContent='P109 pronta: dias em pastas e compromissos em baralho deslizante.';
  }catch(e){console.warn(e);msg.textContent='Atualização aplicada. Abrindo o Carbonautas…'}
  setTimeout(()=>location.replace('./?build=P109&t='+Date.now()),650);
})();
</script>
</body>
</html>
