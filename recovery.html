<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbonautas · Recuperação P43</title>
<style>html,body{height:100%;margin:0;font-family:system-ui;background:#f7fbfb;color:#16262c}main{height:100%;display:grid;place-items:center}div{text-align:center;max-width:560px;padding:28px}h1{margin:0 0 10px;font-size:26px}p{color:#60757d;line-height:1.5}.ok{color:#087f5b;font-weight:700}</style>
</head>
<body>
<main><div><h1>Recuperando o Carbonautas…</h1><p id="msg">Removendo a versão que ficou em loop.</p></div></main>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('carbonautas-')).map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      msg.textContent='Instalando a versão segura P43…';
      const reg=await navigator.serviceWorker.register('./sw.js?v=P43-20260916',{updateViaCache:'none'});
      await reg.update();
      await navigator.serviceWorker.ready;
      if(!navigator.serviceWorker.controller){
        await new Promise(resolve=>{
          let done=false;const finish=()=>{if(done)return;done=true;resolve()};
          navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});
          setTimeout(finish,3500);
        });
      }
    }
    msg.className='ok';msg.textContent='P43 instalada. Abrindo o Carbonautas sem o módulo que causava o loop…';
  }catch(e){console.warn(e);msg.textContent='Recuperação aplicada. Abrindo o Carbonautas…';}
  setTimeout(()=>location.replace('./?build=P43&t='+Date.now()),500);
})();
</script>
</body>
</html>
