<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbonautas · Atualização</title>
<style>html,body{height:100%;margin:0;font-family:system-ui;background:#f7fbfb;color:#16262c}main{height:100%;display:grid;place-items:center}div{text-align:center;max-width:520px;padding:28px}h1{margin:0 0 10px;font-size:26px}p{color:#60757d;line-height:1.5}.ok{color:#087f5b;font-weight:700}</style>
</head>
<body>
<main><div><h1>Atualizando o Carbonautas…</h1><p id="msg">Limpando a versão antiga e instalando a sincronização nova da Agenda.</p></div></main>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('carbonautas-')).map(k=>caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      msg.textContent='Instalando a versão nova…';
      const reg=await navigator.serviceWorker.register('./sw.js?v=P34-20260914-2303',{updateViaCache:'none'});
      await reg.update();
      const worker=reg.installing||reg.waiting||reg.active;
      if(worker&&worker.state!=='activated'){
        await new Promise(resolve=>{
          const done=()=>{if(worker.state==='activated')resolve()};
          worker.addEventListener('statechange',done);
          setTimeout(resolve,5000);
        });
      }
      await navigator.serviceWorker.ready;
      if(!navigator.serviceWorker.controller){
        await new Promise(resolve=>{
          navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true});
          setTimeout(resolve,2500);
        });
      }
    }
    msg.className='ok';msg.textContent='Atualização concluída. Abrindo o Carbonautas…';
  }catch(e){console.warn(e);msg.textContent='A atualização foi aplicada. Abrindo o Carbonautas…';}
  setTimeout(()=>location.replace('./?p34='+Date.now()),350);
})();
</script>
</body>
</html>
